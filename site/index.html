<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: none;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .slide {
    position: fixed; inset: 0;
    background-color: #000;
    opacity: 0; transition: opacity 1.8s ease-in-out;
    overflow: hidden;
  }
  .slide.visible { opacity: 1; }
  .cell {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
  }
  .cell img.slide-img, .cell video.slide-video {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .cell img.ken-burns {
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transform-origin: 50% 50%;
    animation-duration: var(--kb-duration, 62.4s);
    animation-timing-function: linear;
    animation-fill-mode: both;
  }
  .cell img.kb-zoom-in-tl { animation-name: kb-zoom-in-tl; }
  .cell img.kb-zoom-in-br { animation-name: kb-zoom-in-br; }
  .cell img.kb-zoom-in-tr { animation-name: kb-zoom-in-tr; }
  .cell img.kb-zoom-out-center { animation-name: kb-zoom-out-center; }
  .cell img.kb-zoom-out-bl { animation-name: kb-zoom-out-bl; }
  .cell img.kb-pan-drift { animation-name: kb-pan-drift; }

  @keyframes kb-zoom-in-tl {
    0%   { transform: translate3d(0%, 0%, 0) scale(1.005); }
    100% { transform: translate3d(1.8%, 1.2%, 0) scale(1.08); }
  }
  @keyframes kb-zoom-in-br {
    0%   { transform: translate3d(0%, 0%, 0) scale(1.005); }
    100% { transform: translate3d(-1.8%, -1.2%, 0) scale(1.08); }
  }
  @keyframes kb-zoom-in-tr {
    0%   { transform: translate3d(-0.4%, 0.3%, 0) scale(1.015); }
    100% { transform: translate3d(-2.0%, 1.3%, 0) scale(1.085); }
  }
  @keyframes kb-zoom-out-center {
    0%   { transform: translate3d(-1.6%, -1.0%, 0) scale(1.085); }
    100% { transform: translate3d(0%, 0%, 0) scale(1.01); }
  }
  @keyframes kb-zoom-out-bl {
    0%   { transform: translate3d(1.6%, -1.1%, 0) scale(1.085); }
    100% { transform: translate3d(-0.3%, 0.2%, 0) scale(1.015); }
  }
  @keyframes kb-pan-drift {
    0%   { transform: translate3d(-1.5%, 0.5%, 0) scale(1.045); }
    100% { transform: translate3d(1.5%, -0.5%, 0) scale(1.08); }
  }
  .pair-container {
    display: flex; width: 100%; height: 100%; background: #000;
  }
  .pair-container.portrait-split {
    flex-direction: column; gap: 3px;
  }
  .pair-container.landscape-split {
    flex-direction: row; gap: 3px;
  }
  .pair-container .cell {
    flex: 1 1 0; min-width: 0; min-height: 0;
  }
  .triple-container {
    display: flex; width: 100%; height: 100%; background: #000;
  }
  .triple-container.portrait-split {
    flex-direction: column; gap: 3px;
  }
  .triple-container.landscape-split {
    flex-direction: row; gap: 3px;
  }
  .triple-container .cell {
    flex: 1 1 0; min-width: 0; min-height: 0;
  }
  .leftover-container {
    position: relative; width: 100%; height: 100%; background: #000; overflow: hidden;
  }
  .leftover-container .backdrop {
    position: absolute; inset: 0;

  .leftover-container .foreground {
    position: absolute; inset: 0;

    object-fit: contain;
    object-position: center;
    display: block;
  }

  .info-overlay.visible {

  .info-canvas {

  }
  .info-sr-only {
    position: absolute;

    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);

    border: 0;
  }
  @media (max-width: 600px) {
    .info-overlay {
      top: max(7.5vh, env(safe-area-inset-top, 0px) + 24px);
      left: max(6vw, env(safe-area-inset-left, 0px) + 20px);
    }
    .info-overlay.align-right {
      left: auto;
      right: max(6vw, env(safe-area-inset-right, 0px) + 20px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cell img.ken-burns {
      animation: none !important;

    }
    .info-overlay, .info-overlay.visible,
    #pausebtn, #pausebtn.visible {
      transition: opacity 0.05s ease !important;
      transform: none !important;
    }
  }
</style>

<script>
(function () {
  "use strict";

  /* ================= CONFIG & URL PARAMS ================= */
  var urlParams = new URLSearchParams(window.location.search);

  // interval: seconds, default 60
  var SLIDE_MS = 60000;
  var intervalParam = parseFloat(urlParams.get('interval'));
  if (!isNaN(intervalParam) && intervalParam > 0) {
    SLIDE_MS = Math.round(intervalParam * 1000);
  }

  // pairhold: multiplier for paired slides, default 1.5
  var PAIR_HOLD = 1.5;
  var pairholdParam = parseFloat(urlParams.get('pairhold'));
  if (!isNaN(pairholdParam) && pairholdParam > 0) {
    PAIR_HOLD = pairholdParam;
  }

  // shuffle: 0/1, default 1 (true)
  var SHUFFLE = true;
  var shuffleParam = urlParams.get('shuffle');
  if (shuffleParam === '0') {
    SHUFFLE = false;
  } else if (shuffleParam === '1') {
    SHUFFLE = true;
  }

  // layout: auto/single, default auto
  var LAYOUT = 'auto';
  var layoutParam = urlParams.get('layout');
  if (layoutParam === 'single') {
    LAYOUT = 'single';
  }

  // debug: 1 overlays each image filename, dimensions, and computed loss
  var DEBUG = urlParams.get('debug') === '1';

  // stack: 3 enables 3-up vertical split for wide photos in portrait (mirror in landscape)
  var STACK3 = urlParams.get('stack') === '3';

  /* ================= slideshow ================= */
  var slides = [
    document.getElementById('slide-a'),
    document.getElementById('slide-b')
  ];
  var photos = [], slideQueue = [], slideIdx = 0, front = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function photoSrc(p) { return typeof p === 'string' ? p : (p && p.src ? p.src : (p && p.f ? ('photos/' + p.f) : '')); }

  function isVideo(p) {
    if (!p) return false;
    if (p.type === 'video') return true;
    var s = photoSrc(p);
    return /\.(mp4|webm|mov|m4v)$/i.test(s);
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      if (!src) { reject(new Error('Empty src')); return; }
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) {
          settled = true;
          cleanup();
          reject(new Error('Image load timed out: ' + src));
        }
      }, 20000);

      var img = new Image();

      function onOk() {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(img);
      }

      function onErr() {
        if (settled) return;
        settled = true;
        cleanup();

        img.onerror = null;
      }

      img.onerror = onErr;
      img.src = src;

          onOk();
        }).catch(function () {
          if (img.complete) {
            if (img.naturalWidth > 0) onOk();
            else onErr();
          }
        });
      } else {
        if (img.complete) {
          if (img.naturalWidth > 0) onOk();
          else onErr();
        }
      }
    });

  function loadVideo(src) {
    return new Promise(function (resolve, reject) {

          settled = true;
          cleanup();
          reject(new Error('Video load timed out: ' + src));
        }
      }, 20000);

      var video = document.createElement('video');
      video.preload = 'auto';
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('muted', '');
      video.loop = true;

      function onReady() {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(video);
      }

      function onErr() {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('Video failed to load: ' + src));
      }

      function cleanup() {
        clearTimeout(timer);
        video.removeEventListener('loadeddata', onReady);
        video.removeEventListener('canplay', onReady);
        video.removeEventListener('error', onErr);
      }

      if (video.readyState >= 2) {
        onReady();
        return;
      }

      video.addEventListener('canplay', onReady);
      video.addEventListener('error', onErr);

      video.load();
    });
  }

  function loadMedia(photo) {

      return loadVideo(photoSrc(photo));
    }

  }

  function createMediaElement(photo, preloadedMedia) {

      video.preload = 'auto';
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('muted', '');
      video.loop = true;
      video.autoplay = true;

  function getViewportSize() {

  function cropLoss(ia, ca) {
    var minA = Math.min(ia, ca);
    var maxA = Math.max(ia, ca);

  }

  function losses(img, va) {

    var ia = img.w / img.h;
    var caFull = va;
    var caHalf = (va < 1) ? (2 * va) : (va / 2);
    var caThird = (va < 1) ? (3 * va) : (va / 3);
    var lossFull = cropLoss(ia, caFull);
    var lossHalf = cropLoss(ia, caHalf);
    var lossThird = cropLoss(ia, caThird);
    return {
      ia: ia,
      full: lossFull,
      half: lossHalf,
      third: lossThird,
      pairDiff: lossFull - lossHalf,
      stack3Diff: lossHalf - lossThird
    };
  }

  function isPairable(img, va) {
    if (LAYOUT === 'single') return false;
    var l = losses(img, va);
    return l ? (l.pairDiff >= 0.15) : false;
  }

  function isStack3(img, va) {
    if (!STACK3 || LAYOUT === 'single') return false;
    var l = losses(img, va);
    return l ? (l.stack3Diff >= 0.15) : false;
  }

  function getPairScore(p1, p2) {
    if (!p1 || !p2) return 0;
    var p1Partners = p1.partners || [];
    for (var k = 0; k < p1Partners.length; k++) {
      if (p1Partners[k][0] === p2.f) return p1Partners[k][1];
    }
    var p2Partners = p2.partners || [];
    for (var k = 0; k < p2Partners.length; k++) {
      if (p2Partners[k][0] === p1.f) return p2Partners[k][1];

  }

  function getKeepaliveStatus() {

  function updateKeepaliveReadouts() {

    }

  function createDebugBadge(photo, va, pairScore, pairType) {
    if (!DEBUG || !photo) return null;
    var badge = document.createElement('div');
    badge.className = 'debug-badge';
    var lines = [];
    var title = photo.f || photo.src || '';
    if (photo.w && photo.h) {
      title += ' (' + photo.w + '×' + photo.h + ')';
    }
    lines.push(title);
    if (isVideo(photo)) {
      var durStr = photo.duration ? (photo.duration + 's') : 'unknown duration';
      lines.push('type: video · ' + durStr);
    }
    if (photo.w && photo.h) {
      var l = losses(photo, va);
      if (l) {
        var lossLine = 'loss full: ' + l.full.toFixed(3) + ' | half: ' + l.half.toFixed(3);
        lossLine += ' | third: ' + l.third.toFixed(3) + ' (Δh ' + l.pairDiff.toFixed(3) + ' / Δ3 ' + l.stack3Diff.toFixed(3) + ')';
        lines.push(lossLine);
      }
    }
    if (pairScore !== undefined && pairScore !== null) {
      var typeStr = pairType ? (' (' + pairType + ')') : '';
      lines.push('pair score: ' + Number(pairScore).toFixed(3) + typeStr);
    }
    if (photo.date) {
      lines.push('date: ' + photo.date);
    } else {
      lines.push('date: none');
    }
    if (photo.caption) {
      lines.push('caption: "' + photo.caption + '"');
    }
    if (photo.tags) {
      var t = photo.tags;
      var tagParts = [];
      if (t.scene) tagParts.push(t.scene);
      if (t.event_hint && t.event_hint !== 'everyday') tagParts.push(t.event_hint);
      if (t.mood) tagParts.push(t.mood);
      if (t.subjects && t.subjects.length) tagParts.push(t.subjects.join(', '));
      if (t.is_bw) tagParts.push('b&w');
      if (tagParts.length) {
        lines.push('tags: ' + tagParts.join(' · '));
      }
    }
    badge.textContent = lines.join('\n') + '\n';
    var keepaliveDiv = document.createElement('div');
    keepaliveDiv.className = 'debug-keepalive';
    keepaliveDiv.textContent = 'keepalive: ' + getKeepaliveStatus();
    badge.appendChild(keepaliveDiv);
    return badge;
  }

  function pickWeightedPartner(candidates) {
    if (!SHUFFLE || candidates.length === 1) return candidates[0];
    var totalWeight = 0;
    for (var i = 0; i < candidates.length; i++) {

    }
    var r = Math.random() * totalWeight;
    var cum = 0;
    for (var i = 0; i < candidates.length; i++) {
      cum += Math.max(0.001, candidates[i][1]);
      if (r <= cum || i === candidates.length - 1) {
        return candidates[i];
      }
    }
    return candidates[0];
  }

  function getSlideDate(slide) {
    if (!slide || !slide.photos) return null;

    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var key = p.f || p.src;

            if (sc > bestScore) {

        if (bestPair) {
          used[p1.f] = true;
          used[bestPair[0].f] = true;
          used[bestPair[1].f] = true;
          tripleSlides.push({
            type: 'triple',
            photos: [p1, bestPair[0], bestPair[1]],

    // Pass 1: For each unpaired photo, pick from top 3 unused pairable partners (score-weighted)
    for (var i = 0; i < pairable.length; i++) {

      var partners = p1.partners || [];

        var candidateFn = partners[k][0];
        var candidateScore = partners[k][1];

          validCandidates.push(partners[k]);

        }

        var chosen = pickWeightedPartner(validCandidates);
        var p2 = photoMap[chosen[0]];
        if (p2) {
          used[p1.f] = true;
          used[p2.f] = true;
          pairedSlides.push({ type: 'pair', pairType: 'partner', photos: [p1, p2], score: chosen[1] });
        }
      }
    }

    // Pass 2: Pair leftovers with each other where score > 0
    var leftovers = pairable.filter(function (p) { return !used[p.f]; });
    for (var i = 0; i < leftovers.length; i++) {
      var p1 = leftovers[i];
      if (used[p1.f]) continue;

      var bestPartner = null;
      var bestScore = 0;
      for (var j = i + 1; j < leftovers.length; j++) {
        var p2 = leftovers[j];
        if (used[p2.f] || roundFailedPhotos[p2.f]) continue;

        var sc = 0;
        var p1Partners = p1.partners || [];
        for (var k = 0; k < p1Partners.length; k++) {
          if (p1Partners[k][0] === p2.f) { sc = p1Partners[k][1]; break; }
        }
        if (sc === 0) {
          var p2Partners = p2.partners || [];
          for (var k = 0; k < p2Partners.length; k++) {
            if (p2Partners[k][0] === p1.f) { sc = p2Partners[k][1]; break; }

          bestPartner = p2;
        }

      if (bestPartner && bestScore > 0) {

        used[bestPartner.f] = true;
        pairedSlides.push({ type: 'pair', pairType: 'partner', photos: [p1, bestPartner], score: bestScore });

        var candScore = alts[k][1];

        }

      if (validAlts.length > 0) {
        var chosenAlt = pickWeightedPartner(validAlts);
        var p2 = photoMap[chosenAlt[0]];
        if (p2) {
          used[p1.f] = true;
          used[p2.f] = true;
          pairedSlides.push({ type: 'pair', pairType: 'alt', photos: [p1, p2], score: chosenAlt[1] });
        }

    // Pass 3: Fall back to any remaining unused pairable photos sequentially
    var remaining = pairable.filter(function (p) { return !used[p.f]; });
    for (var i = 0; i + 1 < remaining.length; i += 2) {
      used[remaining[i].f] = true;
      used[remaining[i + 1].f] = true;
      pairedSlides.push({ type: 'pair', pairType: 'random', photos: [remaining[i], remaining[i + 1]], score: 0 });
    }

    var leftoverSlides = [];
    if (remaining.length % 2 === 1) {
      var last = remaining[remaining.length - 1];
      used[last.f] = true;
      leftoverSlides.push({ type: 'leftover', photos: [last] });
    }

    var singleSlides = nonPairable.filter(function (p) { return !used[p.f]; }).map(function (p) {
      return { type: 'single', photos: [p] };
    });

    var allSlides = [].concat(tripleSlides, pairedSlides, singleSlides, leftoverSlides);

      idx = Math.floor(Math.random() * KB_CLASSES.length);
      if (idx === lastKbIdx && KB_CLASSES.length > 1) {
        idx = (idx + 1 + Math.floor(Math.random() * (KB_CLASSES.length - 1))) % KB_CLASSES.length;
      }
    } else {
      idx = (lastKbIdx + 1) % KB_CLASSES.length;
    }
    lastKbIdx = idx;
    var cls = KB_CLASSES[idx];

    return cls;

  var showSeq = 0;

  function getLongestSlideDuration() {

  function show(targetIdx) {

      if (failed.length > 0) {

        var dx = x + size * drops[d];
        ctx.beginPath();
        ctx.moveTo(dx + size * 0.03, y + size * 0.70);
        ctx.lineTo(dx - size * 0.04, y + size * 0.90);
        ctx.stroke();
      }
    } else if (iconType === 'snow') {
      drawPillCloud(ctx, cx, y + size * 0.38, size * 0.78, size * 0.46);
      var flakes = [0.28, 0.50, 0.72];
      for (var f = 0; f < flakes.length; f++) {
        ctx.beginPath();
        ctx.arc(x + size * flakes[f], y + size * 0.81, size * 0.06, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (iconType === 'thunderstorm') {
      drawPillCloud(ctx, cx, y + size * 0.36, size * 0.78, size * 0.44);
      ctx.beginPath();
      ctx.moveTo(cx + size * 0.04, y + size * 0.60);
      ctx.lineTo(cx - size * 0.12, y + size * 0.79);
      ctx.lineTo(cx + size * 0.02, y + size * 0.79);
      ctx.lineTo(cx - size * 0.06, y + size * 0.98);
      ctx.lineTo(cx + size * 0.15, y + size * 0.74);
      ctx.lineTo(cx + size * 0.01, y + size * 0.74);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- Giant Rounded-Corner Condensed Numerals (Pixel Lockscreen Style) ---------- */
  function fillStadium(ctx, x, y, w, h) {
    var r = Math.min(w, h) * 0.5;
    ctx.beginPath();
    if (h >= w) {
      ctx.arc(x + r, y + r, r, Math.PI, 0);
      ctx.arc(x + r, y + h - r, r, 0, Math.PI);
    } else {
      ctx.arc(x + r, y + r, r, Math.PI * 0.5, Math.PI * 1.5);
      ctx.arc(x + w - r, y + r, r, Math.PI * 1.5, Math.PI * 0.5);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawLockscreenDigit(ctx, digitChar, x, y, w, h) {
    var t = w * 0.345;
    var cw = w - 2 * t;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#ffffff';

    if (digitChar === '0') {
      fillStadium(ctx, 0, 0, w, h);
      ctx.globalCompositeOperation = 'destination-out';
      fillStadium(ctx, t, t * 0.90, cw, h - t * 1.80);
    } else if (digitChar === '1') {
      var stemX = w * 0.36;
      ctx.fillRect(stemX, 0, t * 1.08, h);
      ctx.beginPath();
      ctx.moveTo(w * 0.08, t * 0.35);
      ctx.lineTo(stemX + t * 1.08, 0);
      ctx.lineTo(stemX + t * 1.08, t * 1.05);
      ctx.lineTo(w * 0.08, t * 1.30);
      ctx.closePath();
      ctx.fill();
    } else if (digitChar === '2') {
      var archH = h * 0.55;
      fillStadium(ctx, 0, 0, w, archH);
      ctx.globalCompositeOperation = 'destination-out';
      fillStadium(ctx, t, t * 0.88, cw, archH - t * 1.65);
      ctx.fillRect(0, h * 0.30, w * 0.55, archH - h * 0.30);
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath();
      ctx.moveTo(w, archH * 0.44);
      ctx.lineTo(w, archH * 0.68);
      ctx.lineTo(t * 0.95, h - t * 0.86);
      ctx.lineTo(0, h - t * 0.86);
      ctx.lineTo(0, h - t * 1.68);
      ctx.lineTo(w - t * 0.92, archH * 0.36);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(0, h - t * 0.92, w, t * 0.92);
    } else if (digitChar === '3') {
      var topH = h * 0.54;
      var botY = h * 0.43;
      var botH = h - botY;
      fillStadium(ctx, w * 0.02, 0, w * 0.96, topH);
      fillStadium(ctx, 0, botY, w, botH);
      ctx.globalCompositeOperation = 'destination-out';
      fillStadium(ctx, w * 0.02 + t * 0.96, t * 0.86, w * 0.96 - t * 1.92, topH - t * 1.68);
      fillStadium(ctx, t * 0.96, botY + t * 0.82, w - t * 1.92, botH - t * 1.68);
      ctx.fillRect(0, h * 0.29, w * 0.52, h * 0.41);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillRect(w * 0.32, h * 0.42, w * 0.48, t * 0.86);
    } else if (digitChar === '4') {
      var rStemX = w - t * 1.16;
      var barY = h * 0.54;
      ctx.fillRect(rStemX, 0, t * 1.02, h);
      ctx.fillRect(0, barY, w, t * 0.90);
      ctx.beginPath();
      ctx.moveTo(w * 0.36, 0);
      ctx.lineTo(w * 0.36 + t * 1.0, 0);
      ctx.lineTo(t * 0.96, barY + t * 0.4);
      ctx.lineTo(0, barY + t * 0.4);
      ctx.lineTo(0, barY - t * 0.25);
      ctx.closePath();
      ctx.fill();
    } else if (digitChar === '5') {
      var bowlY = h * 0.37;
      var bowlH = h - bowlY;
      fillStadium(ctx, 0, bowlY, w, bowlH);
      ctx.globalCompositeOperation = 'destination-out';
      fillStadium(ctx, t * 0.96, bowlY + t * 0.85, w - t * 1.92, bowlH - t * 1.72);
      ctx.fillRect(0, h * 0.54, t * 1.15, h * 0.14);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillRect(w * 0.02, 0, w * 0.94, t * 0.92);
      ctx.fillRect(w * 0.02, 0, t * 0.96, h * 0.55);
    } else if (digitChar === '6') {
      var bY6 = h * 0.40;
      var bH6 = h - bY6;
      fillStadium(ctx, 0, 0, w, h);
      ctx.globalCompositeOperation = 'destination-out';
      fillStadium(ctx, t * 0.96, t * 0.88, w - t * 1.92, h * 0.54);
      ctx.fillRect(w * 0.48, h * 0.25, w * 0.54, h * 0.45);
      ctx.globalCompositeOperation = 'source-over';
      fillStadium(ctx, 0, bY6, w, bH6);
      ctx.fillRect(0, h * 0.25, t * 0.96, h * 0.45);
      ctx.globalCompositeOperation = 'destination-out';
      fillStadium(ctx, t * 0.96, bY6 + t * 0.84, w - t * 1.92, bH6 - t * 1.70);
    } else if (digitChar === '7') {
      ctx.fillRect(0, 0, w, t * 0.94);
      ctx.beginPath();
      ctx.moveTo(w, 0);
      ctx.lineTo(w, t * 1.15);
      ctx.lineTo(w * 0.22 + t * 1.05, h);
      ctx.lineTo(w * 0.22, h);
      ctx.lineTo(w - t * 1.02, t * 0.80);
      ctx.closePath();
      ctx.fill();
    } else if (digitChar === '8') {
      var topH8 = h * 0.53;
      var botY8 = h * 0.44;
      var botH8 = h - botY8;
      fillStadium(ctx, w * 0.03, 0, w * 0.94, topH8);
      fillStadium(ctx, 0, botY8, w, botH8);
      ctx.globalCompositeOperation = 'destination-out';
      fillStadium(ctx, w * 0.03 + t * 0.95, t * 0.84, w * 0.94 - t * 1.90, topH8 - t * 1.66);
      fillStadium(ctx, t * 0.96, botY8 + t * 0.84, w - t * 1.92, botH8 - t * 1.68);
    } else if (digitChar === '9') {
      var topH9 = h * 0.60;
      fillStadium(ctx, 0, 0, w, h);
      ctx.globalCompositeOperation = 'destination-out';
      fillStadium(ctx, t * 0.96, h * 0.38, w - t * 1.92, h * 0.62 - t * 0.88);
      ctx.fillRect(0, h * 0.30, w * 0.52, h * 0.45);
      ctx.globalCompositeOperation = 'source-over';
      fillStadium(ctx, 0, 0, w, topH9);
      ctx.fillRect(w - t * 0.96, h * 0.30, t * 0.96, h * 0.45);
      ctx.globalCompositeOperation = 'destination-out';
      fillStadium(ctx, t * 0.96, t * 0.86, w - t * 1.92, topH9 - t * 1.70);
    }
    ctx.restore();
  }

  /* ---------- Composite Overlay Canvas Renderer ---------- */
  function renderInfoOverlayCanvas() {
    if (!infoCanvasEl || !infoCanvasEl.getContext) return;
    var vp = getViewportSize();
    var vw = vp.w || 1280;
    var vh = vp.h || 800;
    var isPortrait = vh > vw;

    var palette = analyzeSlidePalette(vw, vh);
    if (infoOverlayEl) {
      if (palette.alignRight) {
        infoOverlayEl.classList.add('align-right');
      } else {
        infoOverlayEl.classList.remove('align-right');
      }
    }

    var digitH = isPortrait
      ? Math.min(280, Math.max(115, Math.round(vw * 0.34)))
      : Math.min(240, Math.max(100, Math.round(vh * 0.24)));
    var digitW = Math.round(digitH * 0.565);
    var digitGapX = Math.round(digitH * 0.068);
    var digitGapY = Math.round(digitH * 0.082);
    var headerFontPx = Math.max(18, Math.round(digitH * 0.178));
    var headerGapY = Math.round(digitH * 0.145);

    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var mStr = (m < 10 ? '0' : '') + m;
    var hNum = CLOCK_24 ? h : ((h % 12) || 12);
    var hStr = (hNum < 10 ? '0' : '') + hNum;

    var dateStr = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    var tempVal = (cachedWeather && cachedWeather.temp !== undefined && cachedWeather.temp !== null)
      ? Math.round(cachedWeather.temp)
      : 70;
    var tempStr = tempVal + '°';
    var iconType = (cachedWeather && cachedWeather.icon)
      ? cachedWeather.icon
      : getWeatherIconType(cachedWeather && cachedWeather.code, cachedWeather ? cachedWeather.isDay !== false : true, cachedWeather && cachedWeather.condition);

    var dpr = Math.min(window.devicePixelRatio || 1, 2.25);
    var ctx = infoCanvasEl.getContext('2d');
    if (!ctx) return;

    var headerFont = '600 ' + headerFontPx + 'px "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif';
    ctx.font = headerFont;
    var dateMetrics = ctx.measureText(dateStr);
    var tempMetrics = ctx.measureText(tempStr);
    var dateW = (dateMetrics && dateMetrics.width) ? dateMetrics.width : (dateStr.length * headerFontPx * 0.56);
    var tempW = (tempMetrics && tempMetrics.width) ? tempMetrics.width : (tempStr.length * headerFontPx * 0.62);
    var iconSize = Math.round(headerFontPx * 0.96);
    var gapBeforeIcon = Math.round(headerFontPx * 0.36);
    var gapAfterIcon = Math.round(headerFontPx * 0.16);

    var headerTotalW = Math.ceil(dateW + gapBeforeIcon + iconSize + gapAfterIcon + tempW);
    var digitsTotalW = digitW * 2 + digitGapX;
    var pad = Math.ceil(digitH * 0.08);
    var logicalW = Math.max(headerTotalW, digitsTotalW) + pad * 2;
    var logicalH = headerFontPx + headerGapY + digitH * 2 + digitGapY + pad * 2;

    var pixelW = Math.ceil(logicalW * dpr);
    var pixelH = Math.ceil(logicalH * dpr);

    if (infoCanvasEl.width !== pixelW || infoCanvasEl.height !== pixelH) {
      infoCanvasEl.width = pixelW;
      infoCanvasEl.height = pixelH;
      infoCanvasEl.style.width = logicalW + 'px';
      infoCanvasEl.style.height = logicalH + 'px';
    }

    if (!maskCanvas && document.createElement) {
      maskCanvas = document.createElement('canvas');
      maskCtx = maskCanvas.getContext ? maskCanvas.getContext('2d') : null;
    }
    if (!numCanvas && document.createElement) {
      numCanvas = document.createElement('canvas');
      numCtx = numCanvas.getContext ? numCanvas.getContext('2d', { willReadFrequently: true }) : null;
    }
    if (!backdropCanvas && document.createElement) {
      backdropCanvas = document.createElement('canvas');
      backdropCtx = backdropCanvas.getContext ? backdropCanvas.getContext('2d', { willReadFrequently: true }) : null;
    }
    if (!maskCtx || !numCtx || !backdropCtx) return;

    if (maskCanvas.width !== pixelW || maskCanvas.height !== pixelH) {
      maskCanvas.width = pixelW;
      maskCanvas.height = pixelH;
    }

    var numPad = Math.ceil(digitH * 0.06 * dpr);
    var numPixelW = Math.ceil(digitsTotalW * dpr) + numPad * 2;
    var numPixelH = Math.ceil((digitH * 2 + digitGapY) * dpr) + numPad * 2;
    if (numCanvas.width !== numPixelW || numCanvas.height !== numPixelH) {
      numCanvas.width = numPixelW;
      numCanvas.height = numPixelH;
    }
    numCtx.clearRect(0, 0, numPixelW, numPixelH);
    numCtx.save();
    numCtx.translate(numPad, numPad);
    numCtx.scale(dpr, dpr);
    drawLockscreenDigit(numCtx, hStr.charAt(0), 0, 0, digitW, digitH);
    drawLockscreenDigit(numCtx, hStr.charAt(1), digitW + digitGapX, 0, digitW, digitH);
    drawLockscreenDigit(numCtx, mStr.charAt(0), 0, digitH + digitGapY, digitW, digitH);
    drawLockscreenDigit(numCtx, mStr.charAt(1), digitW + digitGapX, digitH + digitGapY, digitW, digitH);
    numCtx.restore();

    try {
      var numImgData = numCtx.getImageData(0, 0, numPixelW, numPixelH);
      var cornerRadiusPx = Math.max(2, Math.round(digitH * 0.025 * dpr));
      roundGlyphCornersAlpha(numImgData, numPixelW, numPixelH, cornerRadiusPx);
      numCtx.putImageData(numImgData, 0, 0);
    } catch (e) {}

    maskCtx.clearRect(0, 0, pixelW, pixelH);
    maskCtx.save();
    maskCtx.scale(dpr, dpr);

    var headerX = palette.alignRight ? (logicalW - pad - headerTotalW) : pad;
    var headerBaselineY = pad + headerFontPx * 0.84;

    maskCtx.fillStyle = '#ffffff';
    maskCtx.font = headerFont;
    maskCtx.textBaseline = 'alphabetic';
    maskCtx.fillText(dateStr, headerX, headerBaselineY);

    var iconX = headerX + dateW + gapBeforeIcon;
    var iconY = pad + (headerFontPx - iconSize) * 0.45;
    drawWeatherIcon(maskCtx, iconType, iconX, iconY, iconSize);

    var tempX = iconX + iconSize + gapAfterIcon;
    maskCtx.fillStyle = '#ffffff';
    maskCtx.font = headerFont;
    maskCtx.textBaseline = 'alphabetic';
    maskCtx.fillText(tempStr, tempX, headerBaselineY);
    maskCtx.restore();

    var digitsX = palette.alignRight
      ? Math.round((logicalW - pad - digitsTotalW) * dpr) - numPad
      : Math.round(pad * dpr) - numPad;
    var digitsY = Math.round((pad + headerFontPx + headerGapY) * dpr) - numPad;
    maskCtx.drawImage(numCanvas, digitsX, digitsY);

    var bW = 96;
    var bH = Math.max(64, Math.round(96 * (logicalH / Math.max(1, logicalW))));
    if (backdropCanvas.width !== bW || backdropCanvas.height !== bH) {
      backdropCanvas.width = bW;
      backdropCanvas.height = bH;
    }

    var overlayRect = infoOverlayEl && infoOverlayEl.getBoundingClientRect
      ? infoOverlayEl.getBoundingClientRect()
      : { left: vw * 0.065, top: vh * 0.085, width: logicalW, height: logicalH };
    var ox = overlayRect.left || (palette.alignRight ? (vw - logicalW - vw * 0.065) : (vw * 0.065));
    var oy = overlayRect.top || (vh * 0.085);

    var marginX = logicalW * 0.18;
    var marginY = logicalH * 0.18;
    drawSlideRegionToCanvas(
      backdropCtx,
      bW,
      bH,
      ox - marginX,
      oy - marginY,
      logicalW + marginX * 2,
      logicalH + marginY * 2
    );

    try {
      var bgData = backdropCtx.getImageData(0, 0, bW, bH);
      blurImageData(bgData, bW, bH, 14);

      var px = bgData.data;
      var tr = palette.tintRgb[0];
      var tg = palette.tintRgb[1];
      var tb = palette.tintRgb[2];

      for (var pIdx = 0; pIdx < px.length; pIdx += 4) {
        var pr = px[pIdx];
        var pg = px[pIdx + 1];
        var pb = px[pIdx + 2];

        var avg = (pr + pg + pb) / 3;
        var sr = Math.min(255, Math.max(0, avg + (pr - avg) * 1.55));
        var sg = Math.min(255, Math.max(0, avg + (pg - avg) * 1.55));
        var sb = Math.min(255, Math.max(0, avg + (pb - avg) * 1.55));

        var liftedR = sr * 0.56 + 245 * 0.44;
        var liftedG = sg * 0.56 + 245 * 0.44;
        var liftedB = sb * 0.56 + 245 * 0.44;

        px[pIdx] = Math.round(liftedR * 0.42 + tr * 0.58);
        px[pIdx + 1] = Math.round(liftedG * 0.42 + tg * 0.58);
        px[pIdx + 2] = Math.round(liftedB * 0.42 + tb * 0.58);
        px[pIdx + 3] = 255;
      }
      backdropCtx.putImageData(bgData, 0, 0);
    } catch (e) {}

    ctx.clearRect(0, 0, pixelW, pixelH);

    if (palette.localLum > 0.62) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.28, (palette.localLum - 0.60) * 0.75);
      ctx.filter = 'blur(' + Math.round(8 * dpr) + 'px)';
      ctx.drawImage(maskCanvas, 0, Math.round(2 * dpr));
      ctx.globalCompositeOperation = 'source-in';
      ctx.fillStyle = '#090a0f';
      ctx.fillRect(0, 0, pixelW, pixelH);
      ctx.restore();
    }

    ctx.save();
    var srcCropX = bW * (marginX / (logicalW + marginX * 2));
    var srcCropY = bH * (marginY / (logicalH + marginY * 2));
    var srcCropW = bW - srcCropX * 2;
    var srcCropH = bH - srcCropY * 2;
    ctx.drawImage(backdropCanvas, srcCropX, srcCropY, srcCropW, srcCropH, 0, 0, pixelW, pixelH);

    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(maskCanvas, 0, 0);
    ctx.restore();
  }

  function onSlideChangedForOverlay() {
    renderInfoOverlayCanvas();
    if (infoOverlayEl && infoOverlayEl.classList.contains('visible')) {
      var start = Date.now();
      if (infoTransitionRaf) clearInterval(infoTransitionRaf);
      infoTransitionRaf = setInterval(function () {
        renderInfoOverlayCanvas();
        if (Date.now() - start > 1900) {
          clearInterval(infoTransitionRaf);
          infoTransitionRaf = null;
        }
      }, 120);
    }
  }

  function updateClock() {
    var now = new Date();
    var timeEl = document.getElementById('info-time');
    var dateEl = document.getElementById('info-date');

    var h = now.getHours();
    var m = now.getMinutes();
    var mStr = (m < 10 ? '0' : '') + m;
    var hNum = CLOCK_24 ? h : ((h % 12) || 12);
    var hStr = (hNum < 10 ? '0' : '') + hNum;

    if (timeEl) {
      timeEl.innerHTML = '<span class="info-hour">' + hStr + '</span><span class="info-min">' + mStr + '</span>';
    }
    if (dateEl) {
      dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }
    renderInfoOverlayCanvas();
  }

  var pauseBtnEl = document.getElementById('pausebtn');
  var pauseIconEl = document.getElementById('pausebtn-icon-pause');
  var playIconEl = document.getElementById('pausebtn-icon-play');
  var pauseLabelEl = document.getElementById('pausebtn-label');

  function updatePauseBtnUI() {
    if (!pauseBtnEl) {
      pauseBtnEl = document.getElementById('pausebtn');
    }
    if (!pauseBtnEl) return;
    pauseBtnEl.setAttribute('aria-pressed', paused ? 'true' : 'false');
    pauseBtnEl.setAttribute('aria-label', paused ? 'Play slideshow' : 'Pause slideshow');
    pauseBtnEl.setAttribute('data-state', paused ? 'paused' : 'playing');
    if (pauseIconEl) pauseIconEl.style.display = paused ? 'none' : 'block';
    if (playIconEl) playIconEl.style.display = paused ? 'block' : 'none';
    if (pauseLabelEl) pauseLabelEl.textContent = paused ? 'play' : 'pause';
  }

  function pauseSlideshow() {
    paused = true;
    if (slideTimer) {
      clearTimeout(slideTimer);
      slideTimer = null;
    }
    updatePauseBtnUI();
  }

  function resumeSlideshow() {
    paused = false;
    lastSlideChangeTime = Date.now();
    updatePauseBtnUI();
    scheduleNext();
  }

  function togglePause() {
    if (paused) {
      resumeSlideshow();
    } else {
      pauseSlideshow();
    }
  }

  function showInfoOverlay() {
    if (!infoOverlayEl) {
      infoOverlayEl = document.getElementById('info-overlay');
    }
    if (!pauseBtnEl) {
      pauseBtnEl = document.getElementById('pausebtn');
    }
    if (!infoOverlayEl) return;

    if (cachedWeather) {
      renderWeatherUI(cachedWeather);
    }
    updateClock();
    updatePauseBtnUI();

    if (!lastWeatherFetchTime || (Date.now() - lastWeatherFetchTime > 15 * 60 * 1000)) {
      fetchWeather(activeLat, activeLon);
    }

    infoOverlayEl.classList.add('visible');
    if (pauseBtnEl) {
      pauseBtnEl.classList.add('visible');
    }

    if (infoTimer) {
      clearTimeout(infoTimer);
    }
    infoTimer = setTimeout(function () {
      hideInfoOverlay();
    }, INFO_OVERLAY_MS);

    if (!infoClockTicker) {
      infoClockTicker = setInterval(updateClock, 1000);
    }
  }

  function hideInfoOverlay() {
    if (!infoOverlayEl) {
      infoOverlayEl = document.getElementById('info-overlay');
    }
    if (!pauseBtnEl) {
      pauseBtnEl = document.getElementById('pausebtn');
    }
    if (infoOverlayEl) {
      infoOverlayEl.classList.remove('visible');
    }
    if (pauseBtnEl) {
      pauseBtnEl.classList.remove('visible');
    }
    if (infoTimer) {
      clearTimeout(infoTimer);
      infoTimer = null;
    }
    if (infoClockTicker) {
      clearInterval(infoClockTicker);
      infoClockTicker = null;
    }
    if (infoTransitionRaf) {
      clearInterval(infoTransitionRaf);
      infoTransitionRaf = null;
    }
  }

  /* ---------- gesture handling (arms on first, shows info overlay + pause/play button, swipes navigate) ---------- */
  var tapEl = document.getElementById('tapstart');
  function showTapStart() {
    if (armed) return;
    tapEl.classList.add('show');
  }
  function hideTapStart() { tapEl.classList.remove('show'); }
  function arm() {
    hideTapStart();
    hideFsBtn();
    requestLock();
    keepAudio();
    keepVideo();
    goFullscreen();
    armed = true;
  }

  function isControlTarget(target) {
    if (!target) return false;
    if (target.id === 'fsbtn' || target.id === 'pausebtn') return true;
    if (target.closest && (target.closest('#fsbtn') || target.closest('#pausebtn'))) return true;
    return false;
  }

  if (pauseBtnEl) {
    pauseBtnEl.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
    });
    pauseBtnEl.addEventListener('pointerup', function (e) {
      e.stopPropagation();
    });
    pauseBtnEl.addEventListener('touchstart', function (e) {
      e.stopPropagation();
    }, { passive: true });
    pauseBtnEl.addEventListener('touchend', function (e) {
      e.stopPropagation();
    }, { passive: true });
    pauseBtnEl.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!armed) arm();
      togglePause();
      showInfoOverlay();
    });
  }

  var SWIPE_MIN_X = 40;
  var TAP_MAX_MOVE = 35;
  var pointerActive = false;
  var pointerStartX = 0;
  var pointerStartY = 0;
  var pointerLastX = 0;
  var pointerLastY = 0;
  var touchActive = false;
  var touchStartX = 0;
  var touchStartY = 0;
  var touchLastX = 0;
  var touchLastY = 0;
  var lastGestureTime = 0;

  function handleDisplayGesture(deltaX, deltaY) {
    var now = Date.now();
    if (now - lastGestureTime < 80) return;
    lastGestureTime = now;

    if (!isFullscreen()) {
      showFsBtnTemp(10000);
    }
    if (!armed) {
      arm();
    }

    if (Math.abs(deltaX) >= SWIPE_MIN_X && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
      if (deltaX < 0) {
        next();
      } else {
        prev();
      }
      return;
    }

    if (Math.abs(deltaX) <= TAP_MAX_MOVE && Math.abs(deltaY) <= TAP_MAX_MOVE) {
      showInfoOverlay();
    }
  }

  document.addEventListener('pointerdown', function (e) {
    if (isControlTarget(e.target)) {
      pointerActive = false;
      return;
    }
    pointerActive = true;
    pointerStartX = e.clientX;
    pointerStartY = e.clientY;
    pointerLastX = e.clientX;
    pointerLastY = e.clientY;
  });

  document.addEventListener('pointermove', function (e) {
    if (!pointerActive) return;
    pointerLastX = e.clientX;
    pointerLastY = e.clientY;
  });

  document.addEventListener('pointerup', function (e) {
    if (isControlTarget(e.target)) {
      pointerActive = false;
      return;
    }
    var startX = pointerActive ? pointerStartX : e.clientX;
    var startY = pointerActive ? pointerStartY : e.clientY;
    pointerActive = false;
    handleDisplayGesture(e.clientX - startX, e.clientY - startY);
  });

  document.addEventListener('pointercancel', function () {
    if (!pointerActive) return;
    var dx = pointerLastX - pointerStartX;
    var dy = pointerLastY - pointerStartY;
    pointerActive = false;
    if (Math.abs(dx) >= SWIPE_MIN_X && Math.abs(dx) > Math.abs(dy) * 1.2) {
      handleDisplayGesture(dx, dy);
    }
  });

  document.addEventListener('touchstart', function (e) {
    if (isControlTarget(e.target) || !e.touches || e.touches.length !== 1) {
      touchActive = false;
      return;
    }
    touchActive = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchLastX = touchStartX;
    touchLastY = touchStartY;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!touchActive || !e.touches || e.touches.length !== 1) return;
    touchLastX = e.touches[0].clientX;
    touchLastY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (isControlTarget(e.target) || !touchActive) {
      touchActive = false;
      return;
    }
    touchActive = false;
    var endX = (e.changedTouches && e.changedTouches.length) ? e.changedTouches[0].clientX : touchLastX;
    var endY = (e.changedTouches && e.changedTouches.length) ? e.changedTouches[0].clientY : touchLastY;
    handleDisplayGesture(endX - touchStartX, endY - touchStartY);
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (isControlTarget(e.target)) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      next();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      prev();
    } else if (e.key === 'i' || e.key === 't' || e.key === 'w') {
      showInfoOverlay();
    } else if (e.key === 'p' || e.key === 'k') {
      togglePause();
      showInfoOverlay();
    }
  });

  /* ---------- go ---------- */
  initLocationAndWeather();
  setInterval(function () {
    fetchWeather(activeLat, activeLon);
  }, 15 * 60 * 1000);

  if (urlParams.get('overlay') === '1') {
    showInfoOverlay();
  }

  requestLock();
  keepAudio();
  keepVideo();
  goFullscreen();
  setTimeout(function () {
    keepAudio();
    keepVideo();
  }, 1500);

  /* ---------- service worker registration ---------- */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  /* ---------- expose kiosk state for diagnostics and testing ---------- */
  var exposeDiagnostics = DEBUG || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  if (exposeDiagnostics) {
    window.__kiosk = {
      getPhotos: function() { return photos; },
      getQueue: function() { return slideQueue; },
      getSlideIdx: function() { return slideIdx; },
      getSlideMs: function() { return SLIDE_MS; },
      isArmed: function() { return armed; },
      isPaused: function() { return paused; },
      getFront: function() { return front; },
      getSlides: function() { return slides; },
      getSlideTimer: function() { return slideTimer; },
      getShownPhotos: function() { return shownPhotosThisRound; },
      getRoundFailedPhotos: function() { return roundFailedPhotos; },
      getViewportSize: getViewportSize,
      buildSlideQueue: buildSlideQueue,
      renderSlide: renderSlide,
      show: show,
      next: next,
      prev: prev,
      pause: pauseSlideshow,
      play: resumeSlideshow,
      togglePause: togglePause,
      wrapQueue: wrapQueue,
      handleResize: handleResize,
      loadImage: loadImage,
      loadMedia: loadMedia,
      isVideo: isVideo,
      showInfoOverlay: showInfoOverlay,
      hideInfoOverlay: hideInfoOverlay,
      isInfoOverlayVisible: function () {
        return infoOverlayEl ? infoOverlayEl.classList.contains('visible') : false;
      },
      isPauseBtnVisible: function () {
        return pauseBtnEl ? pauseBtnEl.classList.contains('visible') : false;
      },
      getInfoOverlayEl: function () { return infoOverlayEl; },
      getPauseBtnEl: function () { return pauseBtnEl; },
      getInfoPalette: function () { return currentPalette; },
      getCachedWeather: function () { return cachedWeather; },
      fetchWeather: fetchWeather,
      renderWeatherUI: renderWeatherUI,
      renderInfoOverlayCanvas: renderInfoOverlayCanvas,
      updateClock: updateClock
    };
  }
})();
</script>
