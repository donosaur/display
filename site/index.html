<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="build" content="3d5a73912d">
<title>Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: none;
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .slide {
    position: fixed; inset: 0;
    background-color: #000;
    opacity: 0; transition: opacity 1.8s ease-in-out;
    overflow: hidden;
  }
  .slide.visible { opacity: 1; }
  .cell {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
  }
  .cell img.slide-img, .cell video.slide-video {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .pair-container {
    display: flex; width: 100%; height: 100%; background: #000;
  }
  .pair-container.portrait-split {
    flex-direction: column; gap: 3px;
  }
  .pair-container.landscape-split {
    flex-direction: row; gap: 3px;
  }
  .pair-container .cell {
    flex: 1 1 0; min-width: 0; min-height: 0;
  }
  .triple-container {
    display: flex; width: 100%; height: 100%; background: #000;
  }
  .triple-container.portrait-split {
    flex-direction: column; gap: 3px;
  }
  .triple-container.landscape-split {
    flex-direction: row; gap: 3px;
  }
  .triple-container .cell {
    flex: 1 1 0; min-width: 0; min-height: 0;
  }
  .leftover-container {
    position: relative; width: 100%; height: 100%; background: #000; overflow: hidden;
  }
  .leftover-container .backdrop {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    filter: blur(40px) brightness(0.5);
    transform: scale(1.2);
  }
  .leftover-container video.backdrop {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    pointer-events: none;
  }
  .leftover-container .foreground {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .leftover-container .foreground img.slide-img, .leftover-container .foreground video.slide-video {
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
  }
  #fsbtn {
    position: fixed; bottom: 1.5vh; left: 2vw; z-index: 5;
    font-size: 1.6vh; color: rgba(255,255,255,0.5); background: rgba(20,20,22,0.7);
    border: 1px solid #2a2a30; border-radius: 1vh;
    padding: 0.8vh 1.8vh; cursor: pointer;
    display: flex; align-items: center; gap: 0.8vh; font-family: inherit;
  }
  #fsbtn.hide { display: none; }
  #tapstart {
    position: fixed; bottom: 1.5vh; right: 2vw; z-index: 10;
    font-size: 1.5vh; color: rgba(255, 255, 255, 0.65); background: rgba(20, 20, 22, 0.7);
    border: 1px solid #2a2a30; border-radius: 1vh;
    padding: 0.8vh 1.8vh; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-family: inherit;
  }
  #tapstart.show { display: flex; }
  #status-note {
    position: fixed; inset: 0; background: #000; z-index: 8;
    display: none; align-items: center; justify-content: center;
    font-size: 2vh; color: #71717a; letter-spacing: -0.01em;
    pointer-events: none;
  }
  #status-note.show { display: flex; }
  .debug-badge {
    position: absolute; top: 12px; left: 12px; z-index: 5;
    background: rgba(0, 0, 0, 0.78); color: #f4f4f5;
    border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px;
    padding: 6px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 1.4vh; line-height: 1.4; white-space: pre-line;
    pointer-events: none;
  }
  video#vkeep { position: fixed; width: 2px; height: 2px; opacity: 0.01; bottom: 0; left: 0; pointer-events: none; }

  /* Info overlay: minimalist date, time, weather */
  .info-overlay {
    position: fixed;
    bottom: max(3.5vh, env(safe-area-inset-bottom, 0px) + 16px);
    left: max(3.5vw, env(safe-area-inset-left, 0px) + 16px);
    z-index: 25;
    background: rgba(14, 14, 16, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    padding: clamp(16px, 2.2vh, 28px) clamp(20px, 2.5vw, 36px);
    color: #f4f4f5;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.9s;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    user-select: none;
    -webkit-user-select: none;
  }
  .info-overlay.visible {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .info-time {
    font-size: clamp(2.4rem, 5.5vw, 4rem);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    color: #f4f4f5;
    display: flex;
    align-items: baseline;
  }
  .info-ampm {
    font-size: 0.38em;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: rgba(244, 244, 245, 0.6);
    margin-left: 0.4em;
    text-transform: uppercase;
  }
  .info-date {
    font-size: clamp(0.95rem, 1.8vw, 1.25rem);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: rgba(244, 244, 245, 0.85);
    margin-top: 0.2rem;
  }
  .info-weather {
    font-size: clamp(0.9rem, 1.6vw, 1.15rem);
    font-weight: 400;
    line-height: 1.3;
    color: rgba(244, 244, 245, 0.65);
    display: flex;
    align-items: center;
    gap: 0.55em;
    margin-top: 0.1rem;
  }
  .info-dot {
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.9em;
  }
  .info-weather:empty {
    display: none;
  }
  @media (max-width: 600px) {
    .info-overlay {
      bottom: max(2vh, env(safe-area-inset-bottom, 0px) + 12px);
      left: max(3vw, env(safe-area-inset-left, 0px) + 12px);
      right: max(3vw, env(safe-area-inset-right, 0px) + 12px);
      padding: 16px 20px;
      max-width: calc(100vw - 6vw);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .info-overlay, .info-overlay.visible {
      transition: opacity 0.05s ease !important;
    }
  }
</style>
</head>

<div id="slide-a" class="slide"></div>
<div id="slide-b" class="slide"></div>
<div id="info-overlay" class="info-overlay" aria-live="polite">
  <div class="info-time" id="info-time"></div>
  <div class="info-date" id="info-date"></div>
  <div class="info-weather" id="info-weather"></div>
</div>

<script>
(function () {
  "use strict";

  /* ================= CONFIG & URL PARAMS ================= */
  var urlParams = new URLSearchParams(window.location.search);

  // interval: seconds, default 15
  var SLIDE_MS = 15000;
  var intervalParam = parseFloat(urlParams.get('interval'));
  if (!isNaN(intervalParam) && intervalParam > 0) {
    SLIDE_MS = Math.round(intervalParam * 1000);
  }

  // pairhold: multiplier for paired slides, default 1.5
  var PAIR_HOLD = 1.5;
  var pairholdParam = parseFloat(urlParams.get('pairhold'));
  if (!isNaN(pairholdParam) && pairholdParam > 0) {
    PAIR_HOLD = pairholdParam;
  }

  // shuffle: 0/1, default 1 (true)
  var SHUFFLE = true;
  var shuffleParam = urlParams.get('shuffle');
  if (shuffleParam === '0') {
    SHUFFLE = false;
  } else if (shuffleParam === '1') {
    SHUFFLE = true;
  }

  // layout: auto/single, default auto
  var LAYOUT = 'auto';
  var layoutParam = urlParams.get('layout');
  if (layoutParam === 'single') {
    LAYOUT = 'single';
  }

  // debug: 1 overlays each image filename, dimensions, and computed loss
  var DEBUG = urlParams.get('debug') === '1';

  // stack: 3 enables 3-up vertical split for wide photos in portrait (mirror in landscape)
  var STACK3 = urlParams.get('stack') === '3';

  /* ================= slideshow ================= */
  var slides = [
    document.getElementById('slide-a'),
    document.getElementById('slide-b')
  ];
  var photos = [], slideQueue = [], slideIdx = 0, front = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function photoSrc(p) { return typeof p === 'string' ? p : (p && p.src ? p.src : (p && p.f ? ('photos/' + p.f) : '')); }

  function isVideo(p) {
    if (!p) return false;
    if (p.type === 'video') return true;
    var s = photoSrc(p);
    return /\.(mp4|webm|mov|m4v)$/i.test(s);
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      if (!src) { reject(new Error('Empty src')); return; }
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) {
          settled = true;
          cleanup();
          reject(new Error('Image load timed out: ' + src));
        }
      }, 20000);

      var img = new Image();

      function onOk() {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(img);
      }

      function onErr() {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('Image failed to load: ' + src));
      }

      function cleanup() {
        clearTimeout(timer);
        img.onload = null;
        img.onerror = null;
      }

      img.onload = onOk;
      img.onerror = onErr;
      img.src = src;

      if (typeof img.decode === 'function') {
        img.decode().then(function () {
          onOk();
        }).catch(function () {
          if (img.complete) {
            if (img.naturalWidth > 0) onOk();
            else onErr();
          }
        });
      } else {
        if (img.complete) {
          if (img.naturalWidth > 0) onOk();
          else onErr();
        }
      }
    });
  }

  function loadVideo(src) {
    return new Promise(function (resolve, reject) {
      if (!src) { reject(new Error('Empty src')); return; }
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) {
          settled = true;
          cleanup();
          reject(new Error('Video load timed out: ' + src));
        }
      }, 20000);

      var video = document.createElement('video');
      video.preload = 'auto';
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('muted', '');
      video.loop = true;

      function onReady() {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(video);
      }

      function onErr() {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('Video failed to load: ' + src));
      }

      function cleanup() {
        clearTimeout(timer);
        video.removeEventListener('loadeddata', onReady);
        video.removeEventListener('canplay', onReady);
        video.removeEventListener('error', onErr);
      }

      if (video.readyState >= 2) {
        onReady();
        return;
      }

      video.addEventListener('loadeddata', onReady);
      video.addEventListener('canplay', onReady);
      video.addEventListener('error', onErr);

      video.src = src;
      video.load();
    });
  }

  function loadMedia(photo) {
    if (isVideo(photo)) {
      return loadVideo(photoSrc(photo));
    }
    return loadImage(photoSrc(photo));
  }

  function createMediaElement(photo, preloadedMedia) {
    if (isVideo(photo)) {
      var video = preloadedMedia || document.createElement('video');
      if (!video.src) video.src = photoSrc(photo);
      video.preload = 'auto';
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('muted', '');
      video.loop = true;
      video.autoplay = true;
      video.className = 'slide-video';
      return video;
    }
    var img = preloadedMedia || new Image();
    if (!img.src) img.src = photoSrc(photo);
    img.className = 'slide-img';
    return img;
  }

  function preloadSlide(slide) {
    if (!slide || !slide.photos) return;
    for (var i = 0; i < slide.photos.length; i++) {
      loadMedia(slide.photos[i]).catch(function () {});
    }
  }

  function getViewportSize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h, va: w / h };
  }

  function cropLoss(ia, ca) {
    var minA = Math.min(ia, ca);
    var maxA = Math.max(ia, ca);
    return 1 - (minA / maxA);
  }

  function losses(img, va) {
    if (!img || !img.w || !img.h) return null;
    var ia = img.w / img.h;
    var caFull = va;
    var caHalf = (va < 1) ? (2 * va) : (va / 2);
    var caThird = (va < 1) ? (3 * va) : (va / 3);
    var lossFull = cropLoss(ia, caFull);
    var lossHalf = cropLoss(ia, caHalf);
    var lossThird = cropLoss(ia, caThird);
    return {
      ia: ia,
      full: lossFull,
      half: lossHalf,
      third: lossThird,
      pairDiff: lossFull - lossHalf,
      stack3Diff: lossHalf - lossThird
    };
  }

  function isPairable(img, va) {
    if (LAYOUT === 'single') return false;
    var l = losses(img, va);
    return l ? (l.pairDiff >= 0.15) : false;
  }

  function isStack3(img, va) {
    if (!STACK3 || LAYOUT === 'single') return false;
    var l = losses(img, va);
    return l ? (l.stack3Diff >= 0.15) : false;
  }

  function getPairScore(p1, p2) {
    if (!p1 || !p2) return 0;
    var p1Partners = p1.partners || [];
    for (var k = 0; k < p1Partners.length; k++) {
      if (p1Partners[k][0] === p2.f) return p1Partners[k][1];
    }
    var p2Partners = p2.partners || [];
    for (var k = 0; k < p2Partners.length; k++) {
      if (p2Partners[k][0] === p1.f) return p2Partners[k][1];
    }
    return 0;
  }

  function getKeepaliveStatus() {
    var aActive = audio ? (!audio.paused ? 'playing' : 'paused') + ' (rs ' + audio.readyState + ')' : 'none';
    var vActive = vkeep ? (!vkeep.paused ? 'playing' : 'paused') + ' (rs ' + vkeep.readyState + ')' : 'none';
    return 'audio ' + aActive + ' · video ' + vActive;
  }

  function updateKeepaliveReadouts() {
    if (!DEBUG) return;

    var els = document.querySelectorAll('.debug-keepalive');
    for (var i = 0; i < els.length; i++) {
      els[i].textContent = statusText;
    }
  }

  function createDebugBadge(photo, va, pairScore, pairType) {
    if (!DEBUG || !photo) return null;
    var badge = document.createElement('div');
    badge.className = 'debug-badge';
    var lines = [];
    var title = photo.f || photo.src || '';
    if (photo.w && photo.h) {
      title += ' (' + photo.w + '×' + photo.h + ')';
    }
    lines.push(title);
    if (isVideo(photo)) {
      var durStr = photo.duration ? (photo.duration + 's') : 'unknown duration';
      lines.push('type: video · ' + durStr);
    }
    if (photo.w && photo.h) {
      var l = losses(photo, va);
      if (l) {
        var lossLine = 'loss full: ' + l.full.toFixed(3) + ' | half: ' + l.half.toFixed(3);
        lossLine += ' | third: ' + l.third.toFixed(3) + ' (Δh ' + l.pairDiff.toFixed(3) + ' / Δ3 ' + l.stack3Diff.toFixed(3) + ')';
        lines.push(lossLine);

    }
    if (pairScore !== undefined && pairScore !== null) {
      var typeStr = pairType ? (' (' + pairType + ')') : '';
      lines.push('pair score: ' + Number(pairScore).toFixed(3) + typeStr);
    }
    if (photo.date) {
      lines.push('date: ' + photo.date);
    } else {
      lines.push('date: none');
    }
    if (photo.caption) {
      lines.push('caption: "' + photo.caption + '"');

      var tagParts = [];
      if (t.scene) tagParts.push(t.scene);
      if (t.event_hint && t.event_hint !== 'everyday') tagParts.push(t.event_hint);
      if (t.mood) tagParts.push(t.mood);
      if (t.subjects && t.subjects.length) tagParts.push(t.subjects.join(', '));
      if (t.is_bw) tagParts.push('b&w');

  function pickWeightedPartner(candidates) {
    if (!SHUFFLE || candidates.length === 1) return candidates[0];
    var totalWeight = 0;
    for (var i = 0; i < candidates.length; i++) {
      totalWeight += Math.max(0.001, candidates[i][1]);
    }
    var r = Math.random() * totalWeight;
    var cum = 0;
    for (var i = 0; i < candidates.length; i++) {
      cum += Math.max(0.001, candidates[i][1]);
      if (r <= cum || i === candidates.length - 1) {
        return candidates[i];
      }

    return candidates[0];
  }

  function getSlideDate(slide) {
    if (!slide || !slide.photos) return null;

  var photoFailures = {};
  var roundFailedPhotos = {};

  function buildSlideQueue(list, va) {
    if (!list || !list.length) return [];

    var photoMap = {};
    var isPairMap = {};

    var pairable = [];
    var stack3Candidates = [];

    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var key = p.f || p.src;
      if (roundFailedPhotos[key]) continue;
      photoMap[p.f] = p;
      if (isStack3(p, va)) {
        stack3Candidates.push(p);

        pairable.push(p);
      } else {

    if (SHUFFLE) {
      shuffle(stack3Candidates);
      shuffle(pairable);
      shuffle(nonPairable);
    }

    var used = {};
    var tripleSlides = [];

    // Group three photos whose third-cell loss is at least 0.15 lower than half-cell loss
    // choosing the group by partner score where possible
    if (STACK3 && stack3Candidates.length >= 3) {
      for (var s = 0; s < stack3Candidates.length; s++) {
        var p1 = stack3Candidates[s];
        if (used[p1.f]) continue;

        var available = stack3Candidates.filter(function (c) {
          return !used[c.f] && c.f !== p1.f;
        });
        if (available.length < 2) break;

        var bestPair = null;
        var bestScore = -1;

        for (var a = 0; a < available.length; a++) {
          for (var b = a + 1; b < available.length; b++) {
            var candA = available[a];
            var candB = available[b];
            var sc = (getPairScore(p1, candA) + getPairScore(p1, candB) + getPairScore(candA, candB)) / 3;
            if (sc > bestScore) {
              bestScore = sc;
              bestPair = [candA, candB];
            }
          }
        }

        if (bestPair) {
          used[p1.f] = true;
          used[bestPair[0].f] = true;
          used[bestPair[1].f] = true;
          tripleSlides.push({
            type: 'triple',
            photos: [p1, bestPair[0], bestPair[1]],
            score: Math.max(0, bestScore)
          });
        }
      }
    }

    // Leftovers fall back to pairing, then to the blurred single
    var leftoverStack3 = stack3Candidates.filter(function (p) { return !used[p.f]; });
    for (var ls = 0; ls < leftoverStack3.length; ls++) {
      isPairMap[leftoverStack3[ls].f] = true;
      pairable.push(leftoverStack3[ls]);
    }

    var pairedSlides = [];

    // Pass 1: For each unpaired photo, pick from top 3 unused pairable partners (score-weighted)
    for (var i = 0; i < pairable.length; i++) {
      var p1 = pairable[i];
      if (used[p1.f]) continue;

      var validCandidates = [];
      var partners = p1.partners || [];
      for (var k = 0; k < partners.length; k++) {
        var candidateFn = partners[k][0];
        var candidateScore = partners[k][1];
        if (!used[candidateFn] && !roundFailedPhotos[candidateFn] && isPairMap[candidateFn] && candidateFn !== p1.f && candidateScore >= 0.2) {
          validCandidates.push(partners[k]);
          if (validCandidates.length >= 3) break;
        }
      }

      if (validCandidates.length > 0) {
        var chosen = pickWeightedPartner(validCandidates);
        var p2 = photoMap[chosen[0]];
        if (p2) {
          used[p1.f] = true;
          used[p2.f] = true;
          pairedSlides.push({ type: 'pair', pairType: 'partner', photos: [p1, p2], score: chosen[1] });
        }
      }
    }

    // Pass 2: Pair leftovers with each other where score > 0
    var leftovers = pairable.filter(function (p) { return !used[p.f]; });
    for (var i = 0; i < leftovers.length; i++) {
      var p1 = leftovers[i];
      if (used[p1.f]) continue;

      var bestPartner = null;
      var bestScore = 0;
      for (var j = i + 1; j < leftovers.length; j++) {
        var p2 = leftovers[j];
        if (used[p2.f] || roundFailedPhotos[p2.f]) continue;

        var sc = 0;
        var p1Partners = p1.partners || [];
        for (var k = 0; k < p1Partners.length; k++) {
          if (p1Partners[k][0] === p2.f) { sc = p1Partners[k][1]; break; }
        }
        if (sc === 0) {
          var p2Partners = p2.partners || [];
          for (var k = 0; k < p2Partners.length; k++) {
            if (p2Partners[k][0] === p1.f) { sc = p2Partners[k][1]; break; }
          }
        }
        if (sc > bestScore) {
          bestScore = sc;
          bestPartner = p2;
        }
      }

      if (bestPartner && bestScore > 0) {
        used[p1.f] = true;
        used[bestPartner.f] = true;
        pairedSlides.push({ type: 'pair', pairType: 'partner', photos: [p1, bestPartner], score: bestScore });
      }
    }

    // Pass 2b: Pick from alt color partners (top 3, weighted) before sequential fallback
    var altRemaining = pairable.filter(function (p) { return !used[p.f]; });
    for (var i = 0; i < altRemaining.length; i++) {
      var p1 = altRemaining[i];
      if (used[p1.f]) continue;

      var validAlts = [];
      var alts = p1.alt || [];
      for (var k = 0; k < alts.length; k++) {
        var candFn = alts[k][0];
        var candScore = alts[k][1];
        if (!used[candFn] && !roundFailedPhotos[candFn] && isPairMap[candFn] && candFn !== p1.f && candScore > 0) {
          validAlts.push(alts[k]);
          if (validAlts.length >= 3) break;
        }
      }

      if (validAlts.length > 0) {
        var chosenAlt = pickWeightedPartner(validAlts);
        var p2 = photoMap[chosenAlt[0]];
        if (p2) {
          used[p1.f] = true;
          used[p2.f] = true;
          pairedSlides.push({ type: 'pair', pairType: 'alt', photos: [p1, p2], score: chosenAlt[1] });
        }
      }
    }

    // Pass 3: Fall back to any remaining unused pairable photos sequentially
    var remaining = pairable.filter(function (p) { return !used[p.f]; });
    for (var i = 0; i + 1 < remaining.length; i += 2) {
      used[remaining[i].f] = true;
      used[remaining[i + 1].f] = true;
      pairedSlides.push({ type: 'pair', pairType: 'random', photos: [remaining[i], remaining[i + 1]], score: 0 });
    }

    var leftoverSlides = [];
    if (remaining.length % 2 === 1) {
      var last = remaining[remaining.length - 1];
      used[last.f] = true;
      leftoverSlides.push({ type: 'leftover', photos: [last] });
    }

    var singleSlides = nonPairable.map(function (p) {
      return { type: 'single', photos: [p] };
    });

    var allSlides = [].concat(tripleSlides, pairedSlides, singleSlides, leftoverSlides);
    if (SHUFFLE) {
      shuffle(allSlides);

      // Bonus: avoid showing two consecutive slides from the same date where possible
      for (var k = 1; k < allSlides.length - 1; k++) {

        var dCur = getSlideDate(allSlides[k]);

            var dCandidate = getSlideDate(allSlides[m]);

              allSlides[k] = allSlides[m];
              allSlides[m] = tmp;
              break;
            }
          }
        }
      }
    }

    return allSlides;
  }

  function renderSlide(slideEl, slide, va, mediaList) {

    if (slide.type === 'single') {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var media = createMediaElement(slide.photos[0], mediaList && mediaList[0]);
      cell.appendChild(media);
      if (DEBUG) {
        var b = createDebugBadge(slide.photos[0], va);
        if (b) cell.appendChild(b);
      }
      slideEl.appendChild(cell);
    } else if (slide.type === 'pair') {
      var container = document.createElement('div');
      container.className = 'pair-container ' + (va < 1 ? 'portrait-split' : 'landscape-split');
      for (var i = 0; i < slide.photos.length; i++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        var media = createMediaElement(slide.photos[i], mediaList && mediaList[i]);
        cell.appendChild(media);
        if (DEBUG) {
          var b = createDebugBadge(slide.photos[i], va, slide.score, slide.pairType);
          if (b) cell.appendChild(b);
        }
        container.appendChild(cell);
      }
      slideEl.appendChild(container);
    } else if (slide.type === 'triple') {
      var container = document.createElement('div');
      container.className = 'triple-container ' + (va < 1 ? 'portrait-split' : 'landscape-split');
      for (var i = 0; i < slide.photos.length; i++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        var media = createMediaElement(slide.photos[i], mediaList && mediaList[i]);
        cell.appendChild(media);
        if (DEBUG) {
          var b = createDebugBadge(slide.photos[i], va, slide.score);
          if (b) cell.appendChild(b);
        }
        container.appendChild(cell);
      }
      slideEl.appendChild(container);
    } else if (slide.type === 'leftover') {
      var container = document.createElement('div');
      container.className = 'leftover-container';
      var p0 = slide.photos[0];
      if (isVideo(p0)) {
        var bgVideo = document.createElement('video');
        bgVideo.className = 'backdrop';
        bgVideo.src = photoSrc(p0);
        bgVideo.muted = true;
        bgVideo.defaultMuted = true;
        bgVideo.playsInline = true;
        bgVideo.setAttribute('playsinline', '');
        bgVideo.setAttribute('muted', '');
        bgVideo.loop = true;
        bgVideo.autoplay = true;
        container.appendChild(bgVideo);
      } else {
        var bg = document.createElement('div');
        bg.className = 'backdrop';
        bg.style.backgroundImage = 'url("' + photoSrc(p0) + '")';
        container.appendChild(bg);
      }
      var fg = document.createElement('div');
      fg.className = 'foreground';
      var media = createMediaElement(p0, mediaList && mediaList[0]);
      fg.appendChild(media);
      container.appendChild(fg);
      if (DEBUG) {
        var b = createDebugBadge(p0, va);
        if (b) container.appendChild(b);
      }
      slideEl.appendChild(container);
    }
  }

  var showSeq = 0;
  var lastSlideChangeTime = Date.now();
  function getLongestSlideDuration() {
    var max = Math.round(SLIDE_MS * Math.max(1, PAIR_HOLD));
    for (var i = 0; i < photos.length; i++) {
      if (photos[i] && photos[i].duration && photos[i].duration > 0) {
        var vMs = Math.round(photos[i].duration * 1000);
        if (vMs > max) max = vMs;
      }
    }
    return max;
  }

  function show(targetIdx) {
    if (!slideQueue.length) {
      if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
      if (retryTimer) { clearTimeout(retryTimer); }
      retryTimer = setTimeout(function () {
        if (!photos.length) loadManifest();
        else show(0);
      }, 30000);
      return;
    }
    var curIdx = ((targetIdx % slideQueue.length) + slideQueue.length) % slideQueue.length;
    var targetSlide = slideQueue[curIdx];
    var seq = ++showSeq;

    var loadPromises = targetSlide.photos.map(function (p) {
      return loadMedia(p).then(function (mediaEl) {
        return { photo: p, media: mediaEl, ok: true };
      }).catch(function (err) {
        return { photo: p, ok: false, err: err };
      });
    });

    Promise.all(loadPromises).then(function (results) {

      var failed = results.filter(function (r) { return !r.ok; });
      if (failed.length > 0) {

          if (retryTimer) { clearTimeout(retryTimer); }
          retryTimer = setTimeout(function () {
            show(curIdx);
          }, 30000);
          return;
        }

        var vp = getViewportSize();
        var unshown = photos.filter(function (p) {
          var k = p.f || p.src;

        if (!unshown.length) {

        } else {
          slideQueue = buildSlideQueue(unshown, vp.va);
          slideIdx = 0;
        }
        if (!slideQueue.length) {

          if (retryTimer) { clearTimeout(retryTimer); }
          retryTimer = setTimeout(function () { show(0); }, 30000);
          return;
        }
        show(0);
        return;

      consecutiveSlideFailures = 0;
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      globalSuccessLoads += results.length;

      slideIdx = curIdx;
      var back = 1 - front;
      var vp = getViewportSize();
      slides[back]._images = null;
      renderSlide(slides[back], targetSlide, vp.va, loadedMedia);
      slides[back]._images = loadedMedia;
      void slides[back].offsetWidth;
      slides[back].classList.add('visible');
      slides[front].classList.remove('visible');
      var oldFront = front;
      front = back;

      if (!prefersReducedMotion) {

  var slideTimer = null;
  function getSlideDuration(slide) {
    var base = SLIDE_MS;
    if (slide && (slide.type === 'pair' || slide.type === 'triple')) {
      base = Math.round(SLIDE_MS * PAIR_HOLD);
    }
    if (slide && slide.photos) {
      var maxVideoMs = 0;
      for (var i = 0; i < slide.photos.length; i++) {
        var p = slide.photos[i];
        if (p && p.duration && p.duration > 0) {
          var ms = Math.round(p.duration * 1000);
          if (ms > maxVideoMs) maxVideoMs = ms;
        }
      }
      if (maxVideoMs > 0) {
        return Math.max(base, maxVideoMs);
      }
    }
    return base;
  }

  function scheduleNext() {
    if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
    if (!slideQueue.length) return;
    var duration = getSlideDuration(slideQueue[slideIdx]);
    slideTimer = setTimeout(function () {
      next();
    }, duration);
  }

  // Watchdog: if no slide has changed in 3× the longest slide duration and document is visible, call next()
  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    var maxDuration = getLongestSlideDuration();
    if (Date.now() - lastSlideChangeTime > 3 * maxDuration) {
      lastSlideChangeTime = Date.now();
      next();
    }
  }, 5000);

  var lastVa = null;
  var lastIsPortrait = null;

  function wrapQueue() {
    roundFailedPhotos = {};
    shownPhotosThisRound = {};
    var lastSlide = slideQueue[slideIdx];
    var lastPhotos = lastSlide ? lastSlide.photos : [];
    if (SHUFFLE) {
      shuffle(photos);
    }
    var vp = getViewportSize();
    lastVa = vp.va;
    lastIsPortrait = vp.va < 1;
    slideQueue = buildSlideQueue(photos, vp.va);
    if (slideQueue.length > 1 && lastPhotos.length > 0) {
      var firstShares = slideQueue[0].photos.some(function (p1) {
        return lastPhotos.some(function (p2) {
          return (p1.f && p1.f === p2.f) || p1.src === p2.src;
        });
      });
      if (firstShares) {
        for (var k = 1; k < slideQueue.length; k++) {
          var shares = slideQueue[k].photos.some(function (p1) {
            return lastPhotos.some(function (p2) {
              return (p1.f && p1.f === p2.f) || p1.src === p2.src;
            });
          });
          if (!shares) {
            var temp = slideQueue[0];
            slideQueue[0] = slideQueue[k];
            slideQueue[k] = temp;
            break;
          }
        }
      }
    }
  }

  function next() {
    if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
    if (!slideQueue.length) return;
    if (slideIdx + 1 >= slideQueue.length) {
      wrapQueue();
      show(0);
    } else {
      show(slideIdx + 1);
    }
  }

  var pageStartTime = Date.now();
  var buildMetaEl = document.querySelector('meta[name="build"]');
  var CURRENT_BUILD = buildMetaEl ? buildMetaEl.getAttribute('content') : '';

  function mergePhotos(newList) {
    if (!newList || !Array.isArray(newList)) return;
    var newMap = {};
    for (var i = 0; i < newList.length; i++) {
      newMap[newList[i].f] = newList[i];
    }
    // Drop removed photos
    photos = photos.filter(function (p) {
      return !!newMap[p.f];
    });
    // Update existing photos
    for (var j = 0; j < photos.length; j++) {
      var item = newMap[photos[j].f];
      if (item) {
        photos[j].w = item.w || photos[j].w;
        photos[j].h = item.h || photos[j].h;
        photos[j].type = item.type || photos[j].type || (isVideo(item) ? 'video' : 'image');
        photos[j].duration = item.duration !== undefined ? item.duration : photos[j].duration;
        photos[j].date = item.date || null;
        photos[j].geo = item.geo || null;
        photos[j].tags = item.tags || null;
        photos[j].caption = item.caption || null;
        photos[j].luma = item.luma !== undefined ? item.luma : photos[j].luma;
        photos[j].sat = item.sat !== undefined ? item.sat : photos[j].sat;
        photos[j].warmth = item.warmth !== undefined ? item.warmth : photos[j].warmth;
        photos[j].palette = item.palette || photos[j].palette;
        photos[j].phash = item.phash || photos[j].phash;
        photos[j].partners = item.partners || [];
        photos[j].alt = item.alt || [];
      }
    }
    // Add new photos
    var existingMap = {};
    for (var k = 0; k < photos.length; k++) {

    }
    for (var m = 0; m < newList.length; m++) {
      if (!existingMap[newList[m].f]) {
        var newP = Object.assign({}, newList[m]);
        newP.src = 'photos/' + newList[m].f;
        newP.type = newP.type || (isVideo(newP) ? 'video' : 'image');
        newP.partners = newList[m].partners || [];
        newP.alt = newList[m].alt || [];
        photos.push(newP);
      }
    }
  }

  function checkMaintenance() {
    var now = new Date();
    // 1. Fallback full reload: only if up > 7 days, at 4am, and online
    if (now.getHours() === 4 && (Date.now() - pageStartTime) > 7 * 24 * 60 * 60 * 1000) {
      if (navigator.onLine !== false) {
        location.reload();
        return;
      }
    }

    // 2. Fetch photos.json with no-cache and merge updates
    fetch('photos/photos.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (newList) {
        mergePhotos(newList);
        notifySwOfPhotos(newList);
      })
      .catch(function () {});

    // 3. Fetch / with cache: 'no-store', parse build meta, reload only if changed and fetch succeeded and online
    if (navigator.onLine !== false) {
      fetch('/', { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (html) {
          if (!html || navigator.onLine === false) return;
          var m = html.match(/<meta\s+name=["']build["']\s+content=["']([^"']+)["']/i);
          if (m && m[1]) {
            var remoteBuild = m[1];
            if (CURRENT_BUILD && remoteBuild !== CURRENT_BUILD) {
              location.reload();
            }
          }
        })
        .catch(function () {});
    }
  }

  function startPeriodicMaintenance() {
    var checkInterval = DEBUG ? 5000 : 3600000;
    setInterval(checkMaintenance, checkInterval);
  }

  function start() {
    if (!photos.length) return;
    roundFailedPhotos = {};
    shownPhotosThisRound = {};
    if (SHUFFLE) shuffle(photos);
    var vp = getViewportSize();
    lastVa = vp.va;
    lastIsPortrait = vp.va < 1;
    slideQueue = buildSlideQueue(photos, vp.va);
    slideIdx = 0;
    show(0);
    startPeriodicMaintenance();
  }

  var resizeTimer = null;
  function handleResize() {
    if (!photos.length || !slideQueue.length) return;
    ++showSeq;

    var vp = getViewportSize();
    var isPortrait = vp.va < 1;
    var pairableChanged = (lastIsPortrait !== null && lastIsPortrait !== isPortrait);
    if (!pairableChanged && lastVa !== null) {
      for (var pIdx = 0; pIdx < photos.length; pIdx++) {
        if (isPairable(photos[pIdx], vp.va) !== isPairable(photos[pIdx], lastVa) ||
            isStack3(photos[pIdx], vp.va) !== isStack3(photos[pIdx], lastVa)) {
          pairableChanged = true;
          break;
        }
      }
    }

    var curSlide = slideQueue[slideIdx];
    var curSlidePhotos = (curSlide && curSlide.photos) ? curSlide.photos : [];

    if (pairableChanged) {
      lastVa = vp.va;
      lastIsPortrait = isPortrait;

      curSlidePhotos.forEach(function (p) {
        var k = p.f || p.src;
        if (k) shownPhotosThisRound[k] = true;
      });

      var curSlideNew = curSlidePhotos.length ? buildSlideQueue(curSlidePhotos, vp.va) : [];
      if (curSlideNew.length && curSlide && curSlide._images) {
        curSlideNew.forEach(function (cs) {
          cs._images = cs.photos.map(function (p) {
            var idx = curSlide.photos.indexOf(p);
            return idx >= 0 ? curSlide._images[idx] : null;
          });
        });
      }

      var unshown = photos.filter(function (p) {
        var k = p.f || p.src;
        return !shownPhotosThisRound[k] && !roundFailedPhotos[k];
      });
      var remainingQueue = unshown.length ? buildSlideQueue(unshown, vp.va) : [];
      slideQueue = curSlideNew.concat(remainingQueue);
      if (!slideQueue.length) {
        wrapQueue();
      }
      slideIdx = 0;
    } else {
      lastVa = vp.va;
      lastIsPortrait = isPortrait;
    }

    var curSlide = slideQueue[slideIdx];
    renderSlide(slides[front], curSlide, vp.va, curSlide ? curSlide._images : null);
    var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!prefersReducedMotion) {
      var currentVideos = slides[front].querySelectorAll('video');
      for (var vi = 0; vi < currentVideos.length; vi++) {
        var p = currentVideos[vi].play();
        if (p && p.catch) p.catch(function () {});
      }
    }
    scheduleNext();
  }
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(handleResize, 300);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  var armed = false;

  /* ---------- photo list & manifest loading with backoff ---------- */
  var statusNoteEl = document.getElementById('status-note');
  function showStatusNote() {
    if (statusNoteEl) statusNoteEl.classList.add('show');
  }
  function hideStatusNote() {
    if (statusNoteEl) statusNoteEl.classList.remove('show');
  }

  var backoffs = [5000, 15000, 60000, 300000];
  var retryAttempt = 0;

  function notifySwOfPhotos(list) {
    if (!('serviceWorker' in navigator) || !list || !Array.isArray(list)) return;
    var fileList = list.map(function (item) {
      return typeof item === 'string' ? item : item.f;
    }).filter(Boolean);

    var message = {
      type: 'PRUNE_PHOTOS',
      photos: fileList
    };

    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage(message);
    } else {
      navigator.serviceWorker.ready.then(function (reg) {
        if (reg && reg.active) {
          reg.active.postMessage(message);
        }
      }).catch(function () {});
    }
  }

  function loadManifest() {
    fetch('photos/photos.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (list) {
        hideStatusNote();
        retryAttempt = 0;
        initPhotos(list);
        notifySwOfPhotos(list);
      })
      .catch(function () {
        showStatusNote();
        var delay = backoffs[Math.min(retryAttempt, backoffs.length - 1)];
        retryAttempt++;
        setTimeout(loadManifest, delay);
      });
  }

  function initPhotos(list) {
    photos = list.map(function (item) {
      if (typeof item === 'string') {
        return { f: item, src: item, w: 0, h: 0, type: (/\.(mp4|webm|mov|m4v)$/i.test(item) ? 'video' : 'image'), partners: [], alt: [] };
      }
      var p = Object.assign({}, item);
      p.src = 'photos/' + item.f;
      p.type = p.type || (isVideo(p) ? 'video' : 'image');
      p.duration = p.duration !== undefined ? p.duration : (item.duration || null);
      p.partners = item.partners || [];
      p.alt = item.alt || [];
      return p;
    });
    start();
  }

  loadManifest();

  /* ---------- 1) Screen Wake Lock API ---------- */
  var wakeLock = null;
  async function requestLock() {
    if (!('wakeLock' in navigator)) return false;
    if (wakeLock && !wakeLock.released) return true;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function () {
        wakeLock = null;
        if (document.visibilityState === 'visible') {
          requestLock();
        }
      });
      return true;
    } catch (e) {
      wakeLock = null;
      return false;
    }
  }
  setInterval(requestLock, 60000);

  /* ---------- 2) audio keepalive (keeps Silk from timing out) ---------- */
  var audio = document.getElementById('akeep');
  if (urlParams.get('audio') === 'unmuted') {
    audio.muted = false;
    audio.volume = 0.01;
  }
  function keepAudio() {
    try {
      var p = audio.play();
      if (p && p.catch) p.catch(function () { showTapStart(); });
    } catch (e) { showTapStart(); }
  }

  /* ---------- 3) fallback silent video frame ---------- */
  var vkeep = document.getElementById('vkeep');
  var vkeepCanvas = null;
  var vkeepInterval = null;

  function initVideoKeepalive() {
    if (!vkeep || vkeep.srcObject) return;
    try {
      vkeepCanvas = document.createElement('canvas');
      vkeepCanvas.width = 2;
      vkeepCanvas.height = 2;
      var ctx = vkeepCanvas.getContext('2d');
      var toggle = false;
      function drawFrame() {
        toggle = !toggle;
        ctx.fillStyle = toggle ? '#000000' : '#010101';
        ctx.fillRect(0, 0, 1, 1);
      }
      drawFrame();
      vkeepInterval = setInterval(drawFrame, 1000);
      if (typeof vkeepCanvas.captureStream === 'function') {
        vkeep.srcObject = vkeepCanvas.captureStream(1);
        vkeep.play().catch(function () {});
      }
    } catch (e) {}
  }

  function keepVideo() {
    if (vkeep) {
      if (!vkeep.srcObject && document.readyState === 'complete') initVideoKeepalive();
      vkeep.play().catch(function () {});
    }
  }

  if (document.readyState === 'complete') {
    initVideoKeepalive();
  } else {
    window.addEventListener('load', function () {
      setTimeout(initVideoKeepalive, 0);
    });
  }

  if (DEBUG) {
    ['play', 'pause', 'playing', 'canplay', 'loadedmetadata'].forEach(function (ev) {
      if (audio) audio.addEventListener(ev, updateKeepaliveReadouts);
      if (vkeep) vkeep.addEventListener(ev, updateKeepaliveReadouts);
    });
    setInterval(updateKeepaliveReadouts, 1000);
  }

  /* ---------- 4) fullscreen ---------- */
  var fsBtn = document.getElementById('fsbtn');
  var fsHideTimer = null;
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function goFullscreen() {
    if (isFullscreen()) return;
    var el = document.documentElement;
    try {
      var p = null;
      if (el.requestFullscreen) {
        try { p = el.requestFullscreen({ navigationUI: 'hide' }); }
        catch (e) { p = el.requestFullscreen(); }
      } else if (el.webkitRequestFullscreen) {
        p = el.webkitRequestFullscreen();
      }
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }
  function showFsBtnTemp(ms) {
    if (isFullscreen()) {
      hideFsBtn();
      return;
    }
    fsBtn.classList.remove('hide');
    if (fsHideTimer) clearTimeout(fsHideTimer);
    fsHideTimer = setTimeout(function () {
      fsBtn.classList.add('hide');
    }, ms || 10000);
  }
  function hideFsBtn() {
    if (fsHideTimer) { clearTimeout(fsHideTimer); fsHideTimer = null; }
    fsBtn.classList.add('hide');
  }
  function renderFsBtn() {
    if (isFullscreen()) {
      hideFsBtn();
    } else {
      showFsBtnTemp(10000);
    }
  }
  document.addEventListener('fullscreenchange', renderFsBtn);
  document.addEventListener('webkitfullscreenchange', renderFsBtn);
  fsBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    arm();
    goFullscreen();
  });
  fsBtn.addEventListener('pointerup', function (e) {
    e.stopPropagation();
    arm();
  });
  renderFsBtn();

  /* ---------- visibility: re-arm everything ---------- */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { requestLock(); keepAudio(); keepVideo(); goFullscreen(); }
  });

  /* ================= DATE, TIME, WEATHER INFO OVERLAY ================= */
  var INFO_OVERLAY_MS = 14000;
  var infoOverlayEl = document.getElementById('info-overlay');
  var infoTimer = null;
  var infoClockTicker = null;
  var CLOCK_24 = urlParams.get('clock') === '24';

  var WMO_WEATHER_MAP = {
    0: { day: 'Sunny', night: 'Clear' },
    1: { day: 'Mostly sunny', night: 'Mostly clear' },
    2: { day: 'Partly cloudy', night: 'Partly cloudy' },
    3: { day: 'Overcast', night: 'Overcast' },
    45: { day: 'Foggy', night: 'Foggy' },
    48: { day: 'Freezing fog', night: 'Freezing fog' },
    51: { day: 'Light drizzle', night: 'Light drizzle' },
    53: { day: 'Drizzle', night: 'Drizzle' },
    55: { day: 'Heavy drizzle', night: 'Heavy drizzle' },
    56: { day: 'Light freezing drizzle', night: 'Light freezing drizzle' },
    57: { day: 'Freezing drizzle', night: 'Freezing drizzle' },
    61: { day: 'Light rain', night: 'Light rain' },
    63: { day: 'Rain', night: 'Rain' },
    65: { day: 'Heavy rain', night: 'Heavy rain' },
    66: { day: 'Light freezing rain', night: 'Light freezing rain' },
    67: { day: 'Freezing rain', night: 'Freezing rain' },
    71: { day: 'Light snow', night: 'Light snow' },
    73: { day: 'Snow', night: 'Snow' },
    75: { day: 'Heavy snow', night: 'Heavy snow' },
    77: { day: 'Snow grains', night: 'Snow grains' },
    80: { day: 'Light showers', night: 'Light showers' },
    81: { day: 'Showers', night: 'Showers' },
    82: { day: 'Heavy showers', night: 'Heavy showers' },
    85: { day: 'Light snow showers', night: 'Light snow showers' },
    86: { day: 'Snow showers', night: 'Snow showers' },
    95: { day: 'Thunderstorm', night: 'Thunderstorm' },
    96: { day: 'Thunderstorm with hail', night: 'Thunderstorm with hail' },
    99: { day: 'Thunderstorm with hail', night: 'Thunderstorm with hail' }
  };

  function getWeatherCondition(code, isDay) {
    var entry = WMO_WEATHER_MAP[code];
    if (!entry) return isDay ? 'Clear' : 'Clear';
    return isDay ? entry.day : entry.night;
  }

  var cachedWeather = null;
  var lastWeatherFetchTime = 0;
  var weatherFetchInFlight = false;
  var activeLat = null;
  var activeLon = null;

  try {
    var rawCache = localStorage.getItem('display_weather');
    if (rawCache) {
      cachedWeather = JSON.parse(rawCache);
    }
  } catch (err) {}

  function renderWeatherUI(w) {
    var el = document.getElementById('info-weather');
    if (!el) return;
    if (!w || w.temp === undefined || w.temp === null) {
      el.innerHTML = '';
      el.style.display = 'none';
      return;
    }
    el.style.display = 'flex';
    var tempStr = Math.round(w.temp) + '°';
    var condStr = w.condition || '';
    if (condStr) {
      el.innerHTML = '<span class="info-temp">' + tempStr + '</span><span class="info-dot">·</span><span class="info-condition">' + condStr + '</span>';
    } else {
      el.innerHTML = '<span class="info-temp">' + tempStr + '</span>';
    }
  }

  function fetchWeather(userLat, userLon) {
    if (weatherFetchInFlight) return;
    var latParam = parseFloat(urlParams.get('lat'));
    var lonParam = parseFloat(urlParams.get('lon'));
    var lat = (userLat !== undefined && userLat !== null) ? userLat : (!isNaN(latParam) ? latParam : (activeLat || 40.6782));
    var lon = (userLon !== undefined && userLon !== null) ? userLon : (!isNaN(lonParam) ? lonParam : (activeLon || -73.9442));
    activeLat = lat;
    activeLon = lon;

    var unit = (urlParams.get('temp') === 'c' || urlParams.get('units') === 'c') ? 'celsius' : 'fahrenheit';
    weatherFetchInFlight = true;

    var apiUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + Number(lat).toFixed(4) +
      '&longitude=' + Number(lon).toFixed(4) +
      '&current=temperature_2m,weather_code,is_day&temperature_unit=' + unit +
      '&timezone=auto';

    fetch(apiUrl)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        weatherFetchInFlight = false;
        if (!data || !data.current) return;
        var isDay = data.current.is_day !== 0;
        var cond = getWeatherCondition(data.current.weather_code, isDay);
        var w = {
          temp: data.current.temperature_2m,
          condition: cond,
          time: Date.now()
        };
        cachedWeather = w;
        lastWeatherFetchTime = Date.now();
        renderWeatherUI(w);
        try {
          localStorage.setItem('display_weather', JSON.stringify(w));
        } catch (e) {}
      })
      .catch(function () {
        weatherFetchInFlight = false;
        if (cachedWeather) {
          renderWeatherUI(cachedWeather);
        }
      });
  }

  function initLocationAndWeather() {
    if (cachedWeather) {
      renderWeatherUI(cachedWeather);
    }
    var latParam = parseFloat(urlParams.get('lat'));
    var lonParam = parseFloat(urlParams.get('lon'));
    if (!isNaN(latParam) && !isNaN(lonParam)) {
      fetchWeather(latParam, lonParam);
      return;
    }
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          fetchWeather(pos.coords.latitude, pos.coords.longitude);
        },
        function () {
          fetchWeather(40.6782, -73.9442);
        },
        { timeout: 8000, maximumAge: 1800000 }
      );
    } else {
      fetchWeather(40.6782, -73.9442);
    }
  }

  function updateClock() {
    var now = new Date();
    var timeEl = document.getElementById('info-time');
    var dateEl = document.getElementById('info-date');
    if (!timeEl || !dateEl) return;

    var h = now.getHours();
    var m = now.getMinutes();
    var mStr = (m < 10 ? '0' : '') + m;

    if (CLOCK_24) {
      var hStr = (h < 10 ? '0' : '') + h;
      timeEl.innerHTML = hStr + ':' + mStr;
    } else {
      var ampm = h >= 12 ? 'PM' : 'AM';
      var h12 = h % 12;
      if (h12 === 0) h12 = 12;
      timeEl.innerHTML = h12 + ':' + mStr + ' <span class="info-ampm">' + ampm + '</span>';
    }

    var options = { weekday: 'long', month: 'long', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  }

  function showInfoOverlay() {
    if (!infoOverlayEl) {
      infoOverlayEl = document.getElementById('info-overlay');
    }
    if (!infoOverlayEl) return;

    updateClock();
    if (cachedWeather) {
      renderWeatherUI(cachedWeather);
    }
    if (!lastWeatherFetchTime || (Date.now() - lastWeatherFetchTime > 15 * 60 * 1000)) {
      fetchWeather(activeLat, activeLon);
    }

    infoOverlayEl.classList.add('visible');

    if (infoTimer) {
      clearTimeout(infoTimer);
    }
    infoTimer = setTimeout(function () {
      hideInfoOverlay();
    }, INFO_OVERLAY_MS);

    if (!infoClockTicker) {
      infoClockTicker = setInterval(updateClock, 1000);
    }
  }

  function hideInfoOverlay() {
    if (!infoOverlayEl) {
      infoOverlayEl = document.getElementById('info-overlay');
    }
    if (infoOverlayEl) {
      infoOverlayEl.classList.remove('visible');
    }
    if (infoTimer) {
      clearTimeout(infoTimer);
      infoTimer = null;
    }
    if (infoClockTicker) {
      clearInterval(infoClockTicker);
      infoClockTicker = null;
    }
  }

  /* ---------- gesture handling (arms on first, shows info overlay) ---------- */
  var tapEl = document.getElementById('tapstart');
  function showTapStart() { tapEl.classList.add('show'); }
  function hideTapStart() { tapEl.classList.remove('show'); }
  function arm() {
    hideTapStart();
    hideFsBtn();
    requestLock();
    keepAudio();
    keepVideo();
    goFullscreen();
    armed = true;
  }

  var pointerStartX = 0;
  var pointerStartY = 0;
  var pointerStartTime = 0;

  document.addEventListener('pointerdown', function (e) {
    pointerStartX = e.clientX;
    pointerStartY = e.clientY;
    pointerStartTime = Date.now();
  });

  document.addEventListener('pointerup', function (e) {
    var isFsTarget = e.target && (e.target.id === 'fsbtn' || (e.target.closest && e.target.closest('#fsbtn')));
    if (!isFsTarget && !isFullscreen()) {
      showFsBtnTemp(10000);
    }
    if (isFsTarget) return;

    if (!armed) {
      arm();
    }

    var deltaX = e.clientX - pointerStartX;
    var deltaY = e.clientY - pointerStartY;
    var elapsed = Date.now() - pointerStartTime;

    // Horizontal swipe to advance/reverse slides (deliberate swipe > 60px within 600ms)
    if (Math.abs(deltaX) > 60 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5 && elapsed < 600) {
      if (deltaX < 0) {
        next();
      } else {
        if (slideQueue.length > 0) {
          var prevIdx = (slideIdx - 1 + slideQueue.length) % slideQueue.length;
          show(prevIdx);
        }
      }
      return;
    }

    // Touch/tap displays the minimalist date, time, and weather overlay
    // The slideshow continues running in the background uninterrupted
    showInfoOverlay();
  });

  // Keyboard navigation bonus for accessibility, desktop controls, and testing
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      next();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      if (slideQueue.length > 0) {
        var prevIdx = (slideIdx - 1 + slideQueue.length) % slideQueue.length;
        show(prevIdx);
      }
    } else if (e.key === 'i' || e.key === 't' || e.key === 'w') {
      showInfoOverlay();
    }
  });

  /* ---------- go ---------- */
  initLocationAndWeather();
  setInterval(function () {
    fetchWeather(activeLat, activeLon);
  }, 15 * 60 * 1000);

  if (urlParams.get('overlay') === '1') {
    showInfoOverlay();
  }

  requestLock();
  keepAudio();
  keepVideo();
  goFullscreen();
  setTimeout(function () {
    keepAudio();
    keepVideo();
  }, 1500);

  /* ---------- service worker registration ---------- */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  /* ---------- expose kiosk state for diagnostics and testing ---------- */
  var exposeDiagnostics = DEBUG || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  if (exposeDiagnostics) {
    window.__kiosk = {
      getPhotos: function() { return photos; },
      getQueue: function() { return slideQueue; },
      getSlideIdx: function() { return slideIdx; },
      isArmed: function() { return armed; },
      getFront: function() { return front; },
      getSlides: function() { return slides; },
      getSlideTimer: function() { return slideTimer; },
      getShownPhotos: function() { return shownPhotosThisRound; },
      getRoundFailedPhotos: function() { return roundFailedPhotos; },
      getViewportSize: getViewportSize,
      buildSlideQueue: buildSlideQueue,
      renderSlide: renderSlide,
      show: show,
      next: next,
      wrapQueue: wrapQueue,
      handleResize: handleResize,
      loadImage: loadImage,
      loadMedia: loadMedia,
      isVideo: isVideo,
      showInfoOverlay: showInfoOverlay,
      hideInfoOverlay: hideInfoOverlay,
      isInfoOverlayVisible: function () {
        return infoOverlayEl ? infoOverlayEl.classList.contains('visible') : false;
      },
      getInfoOverlayEl: function () { return infoOverlayEl; },
      getCachedWeather: function () { return cachedWeather; },
      fetchWeather: fetchWeather,
      renderWeatherUI: renderWeatherUI,
      updateClock: updateClock
    };
  }
})();
</script>
</body>
