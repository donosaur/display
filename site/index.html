<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: none;
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .slide {
    position: fixed; inset: 0;
    background-color: #000;
    opacity: 0; transition: opacity 1.8s ease-in-out;
    overflow: hidden;
  }
  .slide.visible { opacity: 1; }
  .cell {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
  }
  .cell img.slide-img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .pair-container {
    display: flex; width: 100%; height: 100%; background: #000;
  }
  .pair-container.portrait-split {
    flex-direction: column; gap: 3px;
  }
  .pair-container.landscape-split {
    flex-direction: row; gap: 3px;
  }
  .pair-container .cell {
    flex: 1 1 0; min-width: 0; min-height: 0;
  }
  .triple-container {
    display: flex; width: 100%; height: 100%; background: #000;
  }
  .triple-container.portrait-split {
    flex-direction: column; gap: 3px;
  }
  .triple-container.landscape-split {
    flex-direction: row; gap: 3px;
  }
  .triple-container .cell {
    flex: 1 1 0; min-width: 0; min-height: 0;
  }
  .leftover-container {
    position: relative; width: 100%; height: 100%; background: #000; overflow: hidden;
  }
  .leftover-container .backdrop {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    filter: blur(40px) brightness(0.5);
    transform: scale(1.2);
  }
  .leftover-container .foreground {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .leftover-container .foreground img.slide-img {
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
  }
  #fsbtn {
    position: fixed; bottom: 1.5vh; left: 2vw; z-index: 5;
    font-size: 1.6vh; color: rgba(255,255,255,0.5); background: rgba(20,20,22,0.7);
    border: 1px solid #2a2a30; border-radius: 1vh;
    padding: 0.8vh 1.8vh; cursor: pointer;
    display: flex; align-items: center; gap: 0.8vh; font-family: inherit;
  }
  #fsbtn.hide { display: none; }
  #tapstart {
    position: fixed; bottom: 1.5vh; right: 2vw; z-index: 10;
    font-size: 1.5vh; color: rgba(255, 255, 255, 0.65); background: rgba(20, 20, 22, 0.7);
    border: 1px solid #2a2a30; border-radius: 1vh;
    padding: 0.8vh 1.8vh; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-family: inherit;
  }
  #tapstart.show { display: flex; }
  #status-note {
    position: fixed; inset: 0; background: #000; z-index: 8;
    display: none; align-items: center; justify-content: center;
    font-size: 2vh; color: #71717a; letter-spacing: -0.01em;
    pointer-events: none;
  }
  #status-note.show { display: flex; }
  .debug-badge {
    position: absolute; bottom: 12px; left: 12px; z-index: 5;
    background: rgba(0, 0, 0, 0.78); color: #f4f4f5;
    border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px;
    padding: 6px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 1.4vh; line-height: 1.4; white-space: pre-line;
    pointer-events: none;
  }
  video#vkeep { position: fixed; width: 2px; height: 2px; opacity: 0.01; bottom: 0; left: 0; pointer-events: none; }
</style>
</head>

<script>
(function () {
  "use strict";

  /* ================= CONFIG & URL PARAMS ================= */
  var urlParams = new URLSearchParams(window.location.search);

  // interval: seconds, default 15
  var SLIDE_MS = 15000;
  var intervalParam = parseFloat(urlParams.get('interval'));
  if (!isNaN(intervalParam) && intervalParam > 0) {
    SLIDE_MS = Math.round(intervalParam * 1000);
  }

  // pairhold: multiplier for paired slides, default 1.5
  var PAIR_HOLD = 1.5;
  var pairholdParam = parseFloat(urlParams.get('pairhold'));
  if (!isNaN(pairholdParam) && pairholdParam > 0) {
    PAIR_HOLD = pairholdParam;
  }

  // shuffle: 0/1, default 1 (true)
  var SHUFFLE = true;
  var shuffleParam = urlParams.get('shuffle');
  if (shuffleParam === '0') {
    SHUFFLE = false;
  } else if (shuffleParam === '1') {
    SHUFFLE = true;
  }

  // layout: auto/single, default auto
  var LAYOUT = 'auto';
  var layoutParam = urlParams.get('layout');
  if (layoutParam === 'single') {
    LAYOUT = 'single';
  }

  // debug: 1 overlays each image filename, dimensions, and computed loss
  var DEBUG = urlParams.get('debug') === '1';

  // stack: 3 enables 3-up vertical split for wide photos in portrait (mirror in landscape)
  var STACK3 = urlParams.get('stack') === '3';

  /* ================= slideshow ================= */
  var slides = [
    document.getElementById('slide-a'),
    document.getElementById('slide-b')
  ];
  var photos = [], slideQueue = [], slideIdx = 0, front = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function photoSrc(p) { return typeof p === 'string' ? p : (p && p.src ? p.src : ''); }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      if (!src) { reject(new Error('Empty src')); return; }
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) {
          settled = true;
          cleanup();
          reject(new Error('Image load timed out: ' + src));
        }
      }, 20000);

      var img = new Image();

      function onOk() {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(img);
      }

      function onErr() {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('Image failed to load: ' + src));
      }

      function cleanup() {
        clearTimeout(timer);
        img.onload = null;
        img.onerror = null;
      }

      img.onload = onOk;
      img.onerror = onErr;
      img.src = src;

      if (typeof img.decode === 'function') {
        img.decode().then(function () {
          onOk();
        }).catch(function () {
          if (img.complete) {
            if (img.naturalWidth > 0) onOk();
            else onErr();
          }
        });
      } else {
        if (img.complete) {
          if (img.naturalWidth > 0) onOk();
          else onErr();
        }
      }
    });
  }

  function preloadSlide(slide) {
    if (!slide || !slide.photos) return;
    for (var i = 0; i < slide.photos.length; i++) {
      loadImage(photoSrc(slide.photos[i])).catch(function () {});
    }
  }

  function getViewportSize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h, va: w / h };
  }

  function cropLoss(ia, ca) {
    var minA = Math.min(ia, ca);
    var maxA = Math.max(ia, ca);
    return 1 - (minA / maxA);
  }

  function losses(img, va) {
    if (!img || !img.w || !img.h) return null;
    var ia = img.w / img.h;
    var caFull = va;
    var caHalf = (va < 1) ? (2 * va) : (va / 2);
    var caThird = (va < 1) ? (3 * va) : (va / 3);
    var lossFull = cropLoss(ia, caFull);
    var lossHalf = cropLoss(ia, caHalf);
    var lossThird = cropLoss(ia, caThird);
    return {
      ia: ia,
      full: lossFull,
      half: lossHalf,
      third: lossThird,
      pairDiff: lossFull - lossHalf,
      stack3Diff: lossHalf - lossThird
    };
  }

  function isPairable(img, va) {
    if (LAYOUT === 'single') return false;
    var l = losses(img, va);
    return l ? (l.pairDiff >= 0.15) : false;
  }

  function isStack3(img, va) {
    if (!STACK3 || LAYOUT === 'single') return false;
    var l = losses(img, va);
    return l ? (l.stack3Diff >= 0.15) : false;
  }

  function getPairScore(p1, p2) {
    if (!p1 || !p2) return 0;
    var p1Partners = p1.partners || [];
    for (var k = 0; k < p1Partners.length; k++) {
      if (p1Partners[k][0] === p2.f) return p1Partners[k][1];
    }
    var p2Partners = p2.partners || [];
    for (var k = 0; k < p2Partners.length; k++) {
      if (p2Partners[k][0] === p1.f) return p2Partners[k][1];
    }
    return 0;
  }

  function getKeepaliveStatus() {
    var aActive = audio ? (!audio.paused ? 'playing' : 'paused') + ' (rs ' + audio.readyState + ')' : 'none';
    var vActive = vkeep ? (!vkeep.paused ? 'playing' : 'paused') + ' (rs ' + vkeep.readyState + ')' : 'none';
    return 'audio ' + aActive + ' · video ' + vActive;
  }

  function updateKeepaliveReadouts() {
    if (!DEBUG) return;
    var statusText = 'keepalive: ' + getKeepaliveStatus();
    var els = document.querySelectorAll('.debug-keepalive');
    for (var i = 0; i < els.length; i++) {
      els[i].textContent = statusText;
    }
  }

  function createDebugBadge(photo, va, pairScore, pairType) {
    if (!DEBUG || !photo) return null;
    var badge = document.createElement('div');
    badge.className = 'debug-badge';
    var lines = [];
    var title = photo.f || photo.src || '';
    if (photo.w && photo.h) {
      title += ' (' + photo.w + '×' + photo.h + ')';
    }
    lines.push(title);
    if (photo.w && photo.h) {
      var l = losses(photo, va);
      if (l) {
        var lossLine = 'loss full: ' + l.full.toFixed(3) + ' | half: ' + l.half.toFixed(3);
        lossLine += ' | third: ' + l.third.toFixed(3) + ' (Δh ' + l.pairDiff.toFixed(3) + ' / Δ3 ' + l.stack3Diff.toFixed(3) + ')';
        lines.push(lossLine);
      }
    }
    if (pairScore !== undefined && pairScore !== null) {
      var typeStr = pairType ? (' (' + pairType + ')') : '';
      lines.push('pair score: ' + Number(pairScore).toFixed(3) + typeStr);
    }
    if (photo.date) {
      lines.push('date: ' + photo.date);
    } else {
      lines.push('date: none');
    }
    if (photo.caption) {
      lines.push('caption: "' + photo.caption + '"');
    }
    if (photo.tags) {
      var t = photo.tags;
      var tagParts = [];
      if (t.scene) tagParts.push(t.scene);
      if (t.event_hint && t.event_hint !== 'everyday') tagParts.push(t.event_hint);
      if (t.mood) tagParts.push(t.mood);
      if (t.subjects && t.subjects.length) tagParts.push(t.subjects.join(', '));
      if (t.is_bw) tagParts.push('b&w');
      if (tagParts.length) {
        lines.push('tags: ' + tagParts.join(' · '));
      }
    }
    badge.textContent = lines.join('\n') + '\n';
    var keepaliveDiv = document.createElement('div');
    keepaliveDiv.className = 'debug-keepalive';
    keepaliveDiv.textContent = 'keepalive: ' + getKeepaliveStatus();
    badge.appendChild(keepaliveDiv);
    return badge;
  }

  function pickWeightedPartner(candidates) {
    if (!SHUFFLE || candidates.length === 1) return candidates[0];
    var totalWeight = 0;
    for (var i = 0; i < candidates.length; i++) {
      totalWeight += Math.max(0.001, candidates[i][1]);
    }
    var r = Math.random() * totalWeight;
    var cum = 0;
    for (var i = 0; i < candidates.length; i++) {
      cum += Math.max(0.001, candidates[i][1]);
      if (r <= cum || i === candidates.length - 1) {
        return candidates[i];
      }
    }
    return candidates[0];
  }

  function getSlideDate(slide) {
    if (!slide || !slide.photos) return null;
    for (var k = 0; k < slide.photos.length; k++) {
      if (slide.photos[k].date) return String(slide.photos[k].date).slice(0, 10);
    }
    return null;
  }

  var photoFailures = {};
  var roundFailedPhotos = {};
  var shownPhotosThisRound = {};
  var globalSuccessLoads = 0;
  var consecutiveSlideFailures = 0;
  var retryTimer = null;

  function buildSlideQueue(list, va) {
    if (!list || !list.length) return [];

    var photoMap = {};
    var isPairMap = {};
    var nonPairable = [];
    var pairable = [];
    var stack3Candidates = [];

    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var key = p.f || p.src;
      if (roundFailedPhotos[key]) continue;
      photoMap[p.f] = p;
      if (isStack3(p, va)) {
        stack3Candidates.push(p);
      } else if (isPairable(p, va)) {
        isPairMap[p.f] = true;
        pairable.push(p);
      } else {
        nonPairable.push(p);
      }
    }

    if (SHUFFLE) {
      shuffle(stack3Candidates);
      shuffle(pairable);
      shuffle(nonPairable);
    }

    var used = {};
    var tripleSlides = [];

    // Group three photos whose third-cell loss is at least 0.15 lower than half-cell loss
    // choosing the group by partner score where possible
    if (STACK3 && stack3Candidates.length >= 3) {
      for (var s = 0; s < stack3Candidates.length; s++) {
        var p1 = stack3Candidates[s];
        if (used[p1.f]) continue;

        var available = stack3Candidates.filter(function (c) {
          return !used[c.f] && c.f !== p1.f;
        });
        if (available.length < 2) break;

        var bestPair = null;
        var bestScore = -1;

        for (var a = 0; a < available.length; a++) {
          for (var b = a + 1; b < available.length; b++) {
            var candA = available[a];
            var candB = available[b];
            var sc = (getPairScore(p1, candA) + getPairScore(p1, candB) + getPairScore(candA, candB)) / 3;
            if (sc > bestScore) {
              bestScore = sc;
              bestPair = [candA, candB];
            }
          }
        }

        if (bestPair) {
          used[p1.f] = true;
          used[bestPair[0].f] = true;
          used[bestPair[1].f] = true;
          tripleSlides.push({
            type: 'triple',
            photos: [p1, bestPair[0], bestPair[1]],
            score: Math.max(0, bestScore)
          });
        }
      }
    }

    // Leftovers fall back to pairing, then to the blurred single

  var vkeepCanvas = null;
  var vkeepInterval = null;

  function initVideoKeepalive() {
    if (!vkeep || vkeep.srcObject) return;
    try {
      vkeepCanvas = document.createElement('canvas');
      vkeepCanvas.width = 2;
      vkeepCanvas.height = 2;
      var ctx = vkeepCanvas.getContext('2d');
      var toggle = false;
      function drawFrame() {
        toggle = !toggle;
        ctx.fillStyle = toggle ? '#000000' : '#010101';
        ctx.fillRect(0, 0, 1, 1);
      }
      drawFrame();
      vkeepInterval = setInterval(drawFrame, 1000);
      if (typeof vkeepCanvas.captureStream === 'function') {
        vkeep.srcObject = vkeepCanvas.captureStream(1);
        vkeep.play().catch(function () {});
      }
    } catch (e) {}
  }

  function keepVideo() {
    if (vkeep) {
      if (!vkeep.srcObject && document.readyState === 'complete') initVideoKeepalive();
      vkeep.play().catch(function () {});
    }
  }

  if (document.readyState === 'complete') {
    initVideoKeepalive();
  } else {
    window.addEventListener('load', function () {
      setTimeout(initVideoKeepalive, 0);
    });
  }

  if (DEBUG) {
    ['play', 'pause', 'playing', 'canplay', 'loadedmetadata'].forEach(function (ev) {
      if (audio) audio.addEventListener(ev, updateKeepaliveReadouts);
      if (vkeep) vkeep.addEventListener(ev, updateKeepaliveReadouts);
    });
    setInterval(updateKeepaliveReadouts, 1000);
  }

  /* ---------- 4) fullscreen ---------- */
  var fsBtn = document.getElementById('fsbtn');
  var fsHideTimer = null;
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function goFullscreen() {
    if (isFullscreen()) return;
    var el = document.documentElement;
    try {
      var p = null;
      if (el.requestFullscreen) {
        try { p = el.requestFullscreen({ navigationUI: 'hide' }); }
        catch (e) { p = el.requestFullscreen(); }
      } else if (el.webkitRequestFullscreen) {
        p = el.webkitRequestFullscreen();
      }
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }
  function showFsBtnTemp(ms) {
    if (isFullscreen()) {
      hideFsBtn();
      return;
    }
    fsBtn.classList.remove('hide');
    if (fsHideTimer) clearTimeout(fsHideTimer);
    fsHideTimer = setTimeout(function () {
      fsBtn.classList.add('hide');
    }, ms || 10000);
  }
  function hideFsBtn() {
    if (fsHideTimer) { clearTimeout(fsHideTimer); fsHideTimer = null; }
    fsBtn.classList.add('hide');
  }
  function renderFsBtn() {
    if (isFullscreen()) {
      hideFsBtn();
    } else {
      showFsBtnTemp(10000);
    }
  }
  document.addEventListener('fullscreenchange', renderFsBtn);
  document.addEventListener('webkitfullscreenchange', renderFsBtn);
  fsBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    arm();
    goFullscreen();
  });
  fsBtn.addEventListener('pointerup', function (e) {
    e.stopPropagation();
    arm();
  });
  renderFsBtn();

  /* ---------- visibility: re-arm everything ---------- */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { requestLock(); keepAudio(); keepVideo(); goFullscreen(); }
  });

  /* ---------- gesture handling (arms on first, advances on later) ---------- */
  var tapEl = document.getElementById('tapstart');
  function showTapStart() { tapEl.classList.add('show'); }
  function hideTapStart() { tapEl.classList.remove('show'); }
  function arm() {
    hideTapStart();
    hideFsBtn();
    requestLock();
    keepAudio();
    keepVideo();
    goFullscreen();
    armed = true;
  }
  document.addEventListener('pointerup', function (e) {
    var isFsTarget = e.target && (e.target.id === 'fsbtn' || (e.target.closest && e.target.closest('#fsbtn')));
    if (!isFsTarget && !isFullscreen()) {
      showFsBtnTemp(10000);
    }
    if (isFsTarget) return;

    if (!armed) {
      arm();
      return;
    }
    next();
  });

  /* ---------- go ---------- */
  requestLock();
  keepAudio();
  keepVideo();
  goFullscreen();
  setTimeout(function () {
    keepAudio();
    keepVideo();
  }, 1500);

  /* ---------- service worker registration ---------- */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  /* ---------- expose kiosk state for diagnostics and testing ---------- */
  if (DEBUG) {
    window.__kiosk = {
      getPhotos: function() { return photos; },
      getQueue: function() { return slideQueue; },
      getSlideIdx: function() { return slideIdx; },
      isArmed: function() { return armed; },
      getFront: function() { return front; },
      getSlides: function() { return slides; },
      getSlideTimer: function() { return slideTimer; },
      getShownPhotos: function() { return shownPhotosThisRound; },
      getRoundFailedPhotos: function() { return roundFailedPhotos; },
      getViewportSize: getViewportSize,
      buildSlideQueue: buildSlideQueue,
      renderSlide: renderSlide,
      show: show,
      next: next,
      wrapQueue: wrapQueue,
      handleResize: handleResize,
      loadImage: loadImage
    };
  }
})();
</script>
