<!DOCTYPE html>

<meta charset="UTF-8">

<title>Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: none;
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .slide {
    position: fixed; inset: 0;
    background-color: #000;
    opacity: 0; transition: opacity 1.8s ease-in-out;
    overflow: hidden;
  }
  .slide.visible { opacity: 1; }
  .cell {
    width: 100%; height: 100%;
    background-position: center; background-repeat: no-repeat;
    position: relative;
  }
  .cell.cover {
    background-size: cover;
  }
  .pair-container {
    display: flex; width: 100%; height: 100%; background: #000;
  }
  .pair-container.portrait-split {
    flex-direction: column; gap: 3px;
  }
  .pair-container.landscape-split {
    flex-direction: row; gap: 3px;
  }
  .pair-container .cell {
    flex: 1 1 0; min-width: 0; min-height: 0;
  }
  .leftover-container {
    position: relative; width: 100%; height: 100%; background: #000; overflow: hidden;
  }
  .leftover-container .backdrop {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    filter: blur(40px) brightness(0.5);
    transform: scale(1.2);
  }
  .leftover-container .foreground {
    position: absolute; inset: 0;
    background-size: contain; background-position: center; background-repeat: no-repeat;
  }
  #fsbtn {
    position: fixed; bottom: 1.5vh; left: 2vw; z-index: 5;
    font-size: 1.6vh; color: rgba(255,255,255,0.5); background: rgba(20,20,22,0.7);
    border: 1px solid #2a2a30; border-radius: 1vh;
    padding: 0.8vh 1.8vh; cursor: pointer;
    display: flex; align-items: center; gap: 0.8vh; font-family: inherit;
  }
  #fsbtn.hide { display: none; }
  #tapstart {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 10;
    display: none; align-items: center; justify-content: center;
    font-size: 3vh; color: #d4d4d8; cursor: pointer;
  }
  #tapstart.show { display: flex; }
  #status-note {
    position: fixed; inset: 0; background: #000; z-index: 8;
    display: none; align-items: center; justify-content: center;
    font-size: 2vh; color: #71717a; letter-spacing: -0.01em;
    pointer-events: none;
  }
  #status-note.show { display: flex; }
  .debug-badge {
    position: absolute; bottom: 12px; left: 12px; z-index: 5;
    background: rgba(0, 0, 0, 0.78); color: #f4f4f5;
    border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px;
    padding: 6px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 1.4vh; line-height: 1.4; white-space: pre-line;
    pointer-events: none;
  }
  video#vkeep { position: fixed; width: 2px; height: 2px; opacity: 0.01; bottom: 0; left: 0; pointer-events: none; }
</style>
</head>

<script>
(function () {
  "use strict";

  /* ================= CONFIG & URL PARAMS ================= */
  var urlParams = new URLSearchParams(window.location.search);

  // interval: seconds, default 15
  var SLIDE_MS = 15000;
  var intervalParam = parseFloat(urlParams.get('interval'));
  if (!isNaN(intervalParam) && intervalParam > 0) {
    SLIDE_MS = Math.round(intervalParam * 1000);
  }

  // pairhold: multiplier for paired slides, default 1.5
  var PAIR_HOLD = 1.5;
  var pairholdParam = parseFloat(urlParams.get('pairhold'));
  if (!isNaN(pairholdParam) && pairholdParam > 0) {
    PAIR_HOLD = pairholdParam;
  }

  // shuffle: 0/1, default 1 (true)
  var SHUFFLE = true;
  var shuffleParam = urlParams.get('shuffle');
  if (shuffleParam === '0') {
    SHUFFLE = false;
  } else if (shuffleParam === '1') {
    SHUFFLE = true;
  }

  // layout: auto/single, default auto
  var LAYOUT = 'auto';
  var layoutParam = urlParams.get('layout');
  if (layoutParam === 'single') {
    LAYOUT = 'single';
  }

  // debug: 1 overlays each image filename, dimensions, and computed loss
  var DEBUG = urlParams.get('debug') === '1';

  /* ================= slideshow ================= */
  var slides = [
    document.getElementById('slide-a'),
    document.getElementById('slide-b')
  ];
  var photos = [], slideQueue = [], slideIdx = 0, front = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function photoSrc(p) { return typeof p === 'string' ? p : (p && p.src ? p.src : ''); }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      if (!src) { reject(new Error('Empty src')); return; }
      var img = new Image();
      img.src = src;
      if (typeof img.decode === 'function') {
        img.decode().then(function () {
          resolve(img);
        }).catch(function () {
          img.onload = function () { resolve(img); };
          img.onerror = function () { reject(new Error('Image failed to load: ' + src)); };
          if (img.complete) {
            if (img.naturalWidth > 0) resolve(img);
            else reject(new Error('Image failed to load: ' + src));
          }
        });
      } else {
        img.onload = function () { resolve(img); };
        img.onerror = function () { reject(new Error('Image failed to load: ' + src)); };
        if (img.complete) {
          if (img.naturalWidth > 0) resolve(img);
          else reject(new Error('Image failed to load: ' + src));
        }
      }
    });
  }

  function preloadSlide(slide) {
    if (!slide || !slide.photos) return;
    for (var i = 0; i < slide.photos.length; i++) {
      loadImage(photoSrc(slide.photos[i])).catch(function () {});
    }
  }

  function getViewportSize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h, va: w / h };
  }

  function cropLoss(ia, ca) {
    var minA = Math.min(ia, ca);
    var maxA = Math.max(ia, ca);
    return 1 - (minA / maxA);
  }

  function isPairable(img, va) {
    if (LAYOUT === 'single') return false;
    if (!img || !img.w || !img.h) return false;
    var ia = img.w / img.h;
    var caFull = va;
    var caHalf = (va < 1) ? (2 * va) : (va / 2);
    var lossFull = cropLoss(ia, caFull);
    var lossHalf = cropLoss(ia, caHalf);
    return (lossFull - lossHalf) >= 0.15;
  }

  function createDebugBadge(photo, va, pairScore) {
    if (!DEBUG || !photo) return null;
    var badge = document.createElement('div');
    badge.className = 'debug-badge';
    var lines = [];
    var title = photo.f || photo.src || '';
    if (photo.w && photo.h) {
      title += ' (' + photo.w + '×' + photo.h + ')';
    }
    lines.push(title);
    if (photo.w && photo.h) {
      var ia = photo.w / photo.h;
      var caFull = va;
      var caHalf = (va < 1) ? (2 * va) : (va / 2);
      var lossFull = cropLoss(ia, caFull);
      var lossHalf = cropLoss(ia, caHalf);
      var diff = lossFull - lossHalf;
      lines.push('loss full: ' + lossFull.toFixed(3) + ' | half: ' + lossHalf.toFixed(3) + ' (Δ ' + diff.toFixed(3) + ')');
    }
    if (pairScore !== undefined && pairScore !== null) {
      lines.push('pair score: ' + Number(pairScore).toFixed(3));
    }
    if (photo.date) {
      lines.push('date: ' + photo.date);
    } else {
      lines.push('date: none');
    }
    if (photo.caption) {
      lines.push('caption: "' + photo.caption + '"');
    }
    if (photo.tags) {
      var t = photo.tags;
      var tagParts = [];
      if (t.scene) tagParts.push(t.scene);
      if (t.event_hint && t.event_hint !== 'everyday') tagParts.push(t.event_hint);
      if (t.mood) tagParts.push(t.mood);
      if (t.subjects && t.subjects.length) tagParts.push(t.subjects.join(', '));
      if (t.is_bw) tagParts.push('b&w');
      if (tagParts.length) {
        lines.push('tags: ' + tagParts.join(' · '));
      }
    }
    badge.textContent = lines.join('\n');
    return badge;
  }

  function pickWeightedPartner(candidates) {
    if (candidates.length === 1) return candidates[0];
    var totalWeight = 0;
    for (var i = 0; i < candidates.length; i++) {
      totalWeight += Math.max(0.001, candidates[i][1]);
    }
    var r = Math.random() * totalWeight;
    var cum = 0;
    for (var i = 0; i < candidates.length; i++) {
      cum += Math.max(0.001, candidates[i][1]);
      if (r <= cum || i === candidates.length - 1) {
        return candidates[i];
      }
    }
    return candidates[0];
  }

  function getSlideDate(slide) {
    if (!slide || !slide.photos) return null;
    for (var k = 0; k < slide.photos.length; k++) {
      if (slide.photos[k].date) return String(slide.photos[k].date).slice(0, 10);
    }
    return null;
  }

  var photoFailures = {};
  var roundFailedPhotos = {};
  var globalSuccessLoads = 0;
  var consecutiveSlideFailures = 0;
  var retryTimer = null;

  function buildSlideQueue(list, va) {
    if (!list || !list.length) return [];

    var photoMap = {};
    var isPairMap = {};
    var nonPairable = [];
    var pairable = [];

    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var key = p.f || p.src;
      if (roundFailedPhotos[key]) continue;
      photoMap[p.f] = p;
      if (isPairable(p, va)) {
        isPairMap[p.f] = true;
        pairable.push(p);
      } else {
        nonPairable.push(p);
      }
    }

    if (SHUFFLE) {
      shuffle(pairable);
      shuffle(nonPairable);
    }

    var used = {};
    var pairedSlides = [];

    // Pass 1: For each unpaired photo, pick from top 3 unused pairable partners (score-weighted)
    for (var i = 0; i < pairable.length; i++) {
      var p1 = pairable[i];
      if (used[p1.f]) continue;

      var validCandidates = [];
      var partners = p1.partners || [];
      for (var k = 0; k < partners.length; k++) {
        var candidateFn = partners[k][0];
        var candidateScore = partners[k][1];
        if (!used[candidateFn] && !roundFailedPhotos[candidateFn] && isPairMap[candidateFn] && candidateFn !== p1.f && candidateScore >= 0.2) {
          validCandidates.push(partners[k]);
          if (validCandidates.length >= 3) break;
        }
      }

      if (validCandidates.length > 0) {
        var chosen = pickWeightedPartner(validCandidates);
        var p2 = photoMap[chosen[0]];
        if (p2) {
          used[p1.f] = true;
          used[p2.f] = true;
          pairedSlides.push({ type: 'pair', photos: [p1, p2], score: chosen[1] });
        }
      }
    }

    // Pass 2: Pair leftovers with each other where score > 0
    var leftovers = pairable.filter(function (p) { return !used[p.f]; });
    for (var i = 0; i < leftovers.length; i++) {
      var p1 = leftovers[i];
      if (used[p1.f]) continue;

      var bestPartner = null;
      var bestScore = 0;
      for (var j = i + 1; j < leftovers.length; j++) {
        var p2 = leftovers[j];
        if (used[p2.f] || roundFailedPhotos[p2.f]) continue;

        var sc = 0;
        var p1Partners = p1.partners || [];
        for (var k = 0; k < p1Partners.length; k++) {
          if (p1Partners[k][0] === p2.f) { sc = p1Partners[k][1]; break; }
        }
        if (sc === 0) {
          var p2Partners = p2.partners || [];
          for (var k = 0; k < p2Partners.length; k++) {
            if (p2Partners[k][0] === p1.f) { sc = p2Partners[k][1]; break; }
          }
        }
        if (sc > bestScore) {
          bestScore = sc;
          bestPartner = p2;
        }
      }

      if (bestPartner && bestScore > 0) {
        used[p1.f] = true;
        used[bestPartner.f] = true;
        pairedSlides.push({ type: 'pair', photos: [p1, bestPartner], score: bestScore });
      }
    }

    // Pass 3: Fall back to any remaining unused pairable photos
    var remaining = pairable.filter(function (p) { return !used[p.f]; });
    for (var i = 0; i + 1 < remaining.length; i += 2) {
      used[remaining[i].f] = true;
      used[remaining[i + 1].f] = true;
      pairedSlides.push({ type: 'pair', photos: [remaining[i], remaining[i + 1]], score: 0 });
    }

    var leftoverSlides = [];
    if (remaining.length % 2 === 1) {
      var last = remaining[remaining.length - 1];
      used[last.f] = true;
      leftoverSlides.push({ type: 'leftover', photos: [last] });
    }

    var singleSlides = nonPairable.map(function (p) {
      return { type: 'single', photos: [p] };
    });

    var allSlides = [].concat(pairedSlides, singleSlides, leftoverSlides);
    if (SHUFFLE) {
      shuffle(allSlides);
    }

    // Bonus: avoid showing two consecutive slides from the same date where possible
    for (var k = 1; k < allSlides.length - 1; k++) {
      var dPrev = getSlideDate(allSlides[k - 1]);
      var dCur = getSlideDate(allSlides[k]);
      if (dPrev && dCur && dPrev === dCur) {
        for (var m = k + 1; m < allSlides.length; m++) {
          var dCandidate = getSlideDate(allSlides[m]);
          if (dCandidate !== dPrev) {
            var tmp = allSlides[k];
            allSlides[k] = allSlides[m];
            allSlides[m] = tmp;
            break;
          }
        }
      }
    }

    return allSlides;
  }

  function renderSlide(slideEl, slide, va) {
    slideEl.innerHTML = '';
    if (!slide || !slide.photos.length) return;
    if (slide.type === 'single') {
      var cell = document.createElement('div');
      cell.className = 'cell cover';
      cell.style.backgroundImage = 'url("' + photoSrc(slide.photos[0]) + '")';
      if (DEBUG) {
        var b = createDebugBadge(slide.photos[0], va);
        if (b) cell.appendChild(b);
      }
      slideEl.appendChild(cell);
    } else if (slide.type === 'pair') {
      var container = document.createElement('div');
      container.className = 'pair-container ' + (va < 1 ? 'portrait-split' : 'landscape-split');
      for (var i = 0; i < slide.photos.length; i++) {
        var cell = document.createElement('div');
        cell.className = 'cell cover';
        cell.style.backgroundImage = 'url("' + photoSrc(slide.photos[i]) + '")';
        if (DEBUG) {
          var b = createDebugBadge(slide.photos[i], va, slide.score);
          if (b) cell.appendChild(b);
        }
        container.appendChild(cell);
      }
      slideEl.appendChild(container);
    } else if (slide.type === 'leftover') {
      var container = document.createElement('div');
      container.className = 'leftover-container';
      var bg = document.createElement('div');
      bg.className = 'backdrop';
      bg.style.backgroundImage = 'url("' + photoSrc(slide.photos[0]) + '")';
      var fg = document.createElement('div');
      fg.className = 'foreground';
      fg.style.backgroundImage = 'url("' + photoSrc(slide.photos[0]) + '")';
      container.appendChild(bg);
      container.appendChild(fg);
      if (DEBUG) {
        var b = createDebugBadge(slide.photos[0], va);
        if (b) container.appendChild(b);
      }
      slideEl.appendChild(container);
    }
  }

  var showSeq = 0;
  function show(targetIdx) {
    if (!slideQueue.length) return;
    var curIdx = ((targetIdx % slideQueue.length) + slideQueue.length) % slideQueue.length;
    var targetSlide = slideQueue[curIdx];
    var seq = ++showSeq;

    var loadPromises = targetSlide.photos.map(function (p) {
      return loadImage(photoSrc(p)).then(function () {
        return { photo: p, ok: true };
      }).catch(function (err) {
        return { photo: p, ok: false, err: err };
      });
    });

    Promise.all(loadPromises).then(function (results) {
      if (seq !== showSeq) return;

      var failed = results.filter(function (r) { return !r.ok; });
      if (failed.length > 0) {
        consecutiveSlideFailures++;

        failed.forEach(function (r) {
          var p = r.photo;
          var key = p.f || p.src;
          roundFailedPhotos[key] = true;

          if (navigator.onLine !== false) {
            var rec = photoFailures[key] || { count: 0, lastSuccess: -1 };
            if (rec.count === 0 || globalSuccessLoads > rec.lastSuccess) {
              rec.count++;
              rec.lastSuccess = globalSuccessLoads;
            }
            photoFailures[key] = rec;
            if (rec.count >= 3) {
              photos = photos.filter(function (x) {
                return (x.f && x.f !== key) && x.src !== key;
              });
            }
          }
        });

        if (consecutiveSlideFailures >= 3) {
          if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
          if (retryTimer) { clearTimeout(retryTimer); }
          retryTimer = setTimeout(function () {
            show(curIdx);
          }, 30000);
          return;
        }

        var vp = getViewportSize();
        slideQueue = buildSlideQueue(photos, vp.va);
        if (!slideQueue.length) {
          if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
          if (retryTimer) { clearTimeout(retryTimer); }
          retryTimer = setTimeout(function () { show(0); }, 30000);
          return;
        }
        show(curIdx);
        return;
      }

      consecutiveSlideFailures = 0;
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      globalSuccessLoads += results.length;

      slideIdx = curIdx;
      var back = 1 - front;
      var vp = getViewportSize();
      renderSlide(slides[back], targetSlide, vp.va);
      void slides[back].offsetWidth;
      slides[back].classList.add('visible');
      slides[front].classList.remove('visible');
      front = back;

      // Preload next slide images in the background
      var nextSlide = slideQueue[(slideIdx + 1) % slideQueue.length];
      preloadSlide(nextSlide);

      // Restart auto-advance timer for this slide
      scheduleNext();
    });
  }

  var slideTimer = null;
  function getSlideDuration(slide) {
    if (slide && slide.type === 'pair') {
      return Math.round(SLIDE_MS * PAIR_HOLD);
    }
    return SLIDE_MS;
  }

  function scheduleNext() {
    if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
    if (!slideQueue.length) return;
    var duration = getSlideDuration(slideQueue[slideIdx]);
    slideTimer = setTimeout(function () {
      next();
    }, duration);
  }

  var lastVa = null;
  var lastIsPortrait = null;

  function wrapQueue() {
    roundFailedPhotos = {};
    var lastSlide = slideQueue[slideIdx];
    var lastPhotos = lastSlide ? lastSlide.photos : [];
    if (SHUFFLE) {
      shuffle(photos);
    }
    var vp = getViewportSize();
    lastVa = vp.va;
    lastIsPortrait = vp.va < 1;
    slideQueue = buildSlideQueue(photos, vp.va);
    if (slideQueue.length > 1 && lastPhotos.length > 0) {
      var firstShares = slideQueue[0].photos.some(function (p1) {
        return lastPhotos.some(function (p2) {
          return (p1.f && p1.f === p2.f) || p1.src === p2.src;
        });
      });
      if (firstShares) {
        for (var k = 1; k < slideQueue.length; k++) {
          var shares = slideQueue[k].photos.some(function (p1) {
            return lastPhotos.some(function (p2) {
              return (p1.f && p1.f === p2.f) || p1.src === p2.src;
            });
          });
          if (!shares) {
            var temp = slideQueue[0];
            slideQueue[0] = slideQueue[k];
            slideQueue[k] = temp;
            break;
          }
        }
      }
    }
  }

  function next() {
    if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
    if (!slideQueue.length) return;
    if (slideIdx + 1 >= slideQueue.length) {
      wrapQueue();
      show(0);
    } else {
      show(slideIdx + 1);
    }
  }

  function scheduleNightlyReload() {
    var now = new Date();
    var next4am = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 4, 0, 0, 0);
    if (now.getTime() >= next4am.getTime()) {
      next4am.setDate(next4am.getDate() + 1);
    }
    var msUntil4am = next4am.getTime() - now.getTime();
    setTimeout(function () {
      location.reload();
    }, msUntil4am);
  }

  function start() {
    if (!photos.length) return;
    if (SHUFFLE) shuffle(photos);
    var vp = getViewportSize();
    lastVa = vp.va;
    lastIsPortrait = vp.va < 1;
    slideQueue = buildSlideQueue(photos, vp.va);
    slideIdx = 0;
    show(0);
    scheduleNightlyReload();
  }

  var resizeTimer = null;
  function handleResize() {
    if (!photos.length || !slideQueue.length) return;
    ++showSeq;

    var vp = getViewportSize();
    var isPortrait = vp.va < 1;
    var pairableChanged = (lastIsPortrait !== null && lastIsPortrait !== isPortrait);
    if (!pairableChanged && lastVa !== null) {
      for (var pIdx = 0; pIdx < photos.length; pIdx++) {
        if (isPairable(photos[pIdx], vp.va) !== isPairable(photos[pIdx], lastVa)) {
          pairableChanged = true;
          break;
        }
      }
    }

    var currentPhoto = null;
    if (slideQueue[slideIdx] && slideQueue[slideIdx].photos.length) {
      currentPhoto = slideQueue[slideIdx].photos[0];
    }

    if (pairableChanged) {
      slideQueue = buildSlideQueue(photos, vp.va);
      lastVa = vp.va;
      lastIsPortrait = isPortrait;
      var newIdx = 0;
      if (currentPhoto) {
        var found = false;
        for (var i = 0; i < slideQueue.length; i++) {
          for (var j = 0; j < slideQueue[i].photos.length; j++) {
            if (slideQueue[i].photos[j].f === currentPhoto.f || slideQueue[i].photos[j].src === currentPhoto.src) {
              newIdx = i;
              found = true;
              break;
            }
          }
          if (found) break;
        }
      }
      slideIdx = newIdx;
    } else {
      lastVa = vp.va;
      lastIsPortrait = isPortrait;
    }

    renderSlide(slides[front], slideQueue[slideIdx], vp.va);
    scheduleNext();
  }
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(handleResize, 300);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  var armed = false;

  /* ---------- photo list & manifest loading with backoff ---------- */
  var statusNoteEl = document.getElementById('status-note');
  function showStatusNote() {
    if (statusNoteEl) statusNoteEl.classList.add('show');
  }
  function hideStatusNote() {
    if (statusNoteEl) statusNoteEl.classList.remove('show');
  }

  var backoffs = [5000, 15000, 60000, 300000];
  var retryAttempt = 0;

  function loadManifest() {
    fetch('photos/photos.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (list) {
        hideStatusNote();
        retryAttempt = 0;
        initPhotos(list);
      })
      .catch(function () {
        showStatusNote();
        var delay = backoffs[Math.min(retryAttempt, backoffs.length - 1)];
        retryAttempt++;
        setTimeout(loadManifest, delay);
      });
  }

  function initPhotos(list) {
    photos = list.map(function (item) {
      if (typeof item === 'string') {
        return { f: item, src: item, w: 0, h: 0, partners: [] };
      }
      var p = Object.assign({}, item);
      p.src = 'photos/' + item.f;
      p.partners = item.partners || [];
      return p;
    });
    start();
  }

  loadManifest();

  /* ---------- 1) Screen Wake Lock API ---------- */
  var wakeLock = null;
  async function requestLock() {
    if (!('wakeLock' in navigator)) return false;
    if (wakeLock && !wakeLock.released) return true;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function () {
        wakeLock = null;
      });
      return true;
    } catch (e) {
      wakeLock = null;
      return false;
    }
  }
  setInterval(requestLock, 60000);

  /* ---------- 2) audio keepalive (keeps Silk from timing out) ---------- */
  var audio = document.getElementById('akeep');
  if (urlParams.get('audio') === 'unmuted') {
    audio.muted = false;
    audio.volume = 0.01;
  }
  function keepAudio() {
    try {
      var p = audio.play();
      if (p && p.catch) p.catch(function () { showTapStart(); });
    } catch (e) { showTapStart(); }
  }

  /* ---------- 3) fallback silent video frame ---------- */
  try {
    var v = document.getElementById('vkeep');
    var c = document.createElement('canvas'); c.width = 2; c.height = 2;
    v.srcObject = c.captureStream(1);
    v.play().catch(function(){});
  } catch (e) {}

  /* ---------- 4) fullscreen ---------- */
  var fsBtn = document.getElementById('fsbtn');
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function goFullscreen() {
    if (isFullscreen()) return;
    var el = document.documentElement;
    try {
      var p = null;
      if (el.requestFullscreen) {
        try { p = el.requestFullscreen({ navigationUI: 'hide' }); }
        catch (e) { p = el.requestFullscreen(); }
      } else if (el.webkitRequestFullscreen) {
        p = el.webkitRequestFullscreen();
      }
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }
  function renderFsBtn() { fsBtn.classList.toggle('hide', isFullscreen()); }
  document.addEventListener('fullscreenchange', renderFsBtn);
  document.addEventListener('webkitfullscreenchange', renderFsBtn);
  fsBtn.addEventListener('click', function (e) { e.stopPropagation(); goFullscreen(); });
  fsBtn.addEventListener('pointerup', function (e) { e.stopPropagation(); });
  renderFsBtn();

  /* ---------- visibility: re-arm everything ---------- */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { requestLock(); keepAudio(); goFullscreen(); }
  });

  /* ---------- gesture handling (arms on first, advances on later) ---------- */
  var tapEl = document.getElementById('tapstart');
  function showTapStart() { tapEl.classList.add('show'); }
  function hideTapStart() { tapEl.classList.remove('show'); }
  function arm() {
    hideTapStart(); requestLock(); keepAudio(); goFullscreen();
    armed = true;
  }
  document.addEventListener('pointerup', function (e) {
    if (e.target && (e.target.id === 'fsbtn' || (e.target.closest && e.target.closest('#fsbtn')))) {
      return;
    }
    if (!armed) {
      arm();
      return;
    }
    next();
  });

  /* ---------- go ---------- */
  requestLock();
  keepAudio();
  goFullscreen();
  setTimeout(keepAudio, 1500);
  /* ---------- expose kiosk state for diagnostics and testing ---------- */
  window.__kiosk = {
    getPhotos: function() { return photos; },
    getQueue: function() { return slideQueue; },
    getSlideIdx: function() { return slideIdx; },
    isArmed: function() { return armed; },
    getFront: function() { return front; },
    getSlides: function() { return slides; },
    getSlideTimer: function() { return slideTimer; },
    getViewportSize: getViewportSize,
    buildSlideQueue: buildSlideQueue,
    renderSlide: renderSlide,
    show: show,
    next: next
  };
})();
</script>
</body>
</html>
