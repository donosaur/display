<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: none;
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .slide {
    position: fixed; inset: 0;
    background-color: #000;
    opacity: 0; transition: opacity 1.8s ease-in-out;
    overflow: hidden;
  }
  .slide.visible { opacity: 1; }
  .cell {
    width: 100%; height: 100%;
    background-position: center; background-repeat: no-repeat;
    position: relative;
  }
  .cell.cover {
    background-size: cover;
  }
  .pair-container {
    display: flex; width: 100%; height: 100%; background: #000;
  }
  .pair-container.portrait-split {
    flex-direction: column; gap: 3px;
  }
  .pair-container.landscape-split {
    flex-direction: row; gap: 3px;
  }
  .pair-container .cell {
    flex: 1 1 0; min-width: 0; min-height: 0;
  }
  .leftover-container {
    position: relative; width: 100%; height: 100%; background: #000; overflow: hidden;
  }
  .leftover-container .backdrop {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    filter: blur(40px) brightness(0.5);
    transform: scale(1.2);
  }
  .leftover-container .foreground {
    position: absolute; inset: 0;
    background-size: contain; background-position: center; background-repeat: no-repeat;
  }
  #fsbtn {
    position: fixed; bottom: 1.5vh; left: 2vw; z-index: 5;
    font-size: 1.6vh; color: rgba(255,255,255,0.5); background: rgba(20,20,22,0.7);
    border: 1px solid #2a2a30; border-radius: 1vh;
    padding: 0.8vh 1.8vh; cursor: pointer;
    display: flex; align-items: center; gap: 0.8vh; font-family: inherit;
  }
  #fsbtn.hide { display: none; }
  #tapstart {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 10;
    display: none; align-items: center; justify-content: center;
    font-size: 3vh; color: #d4d4d8; cursor: pointer;
  }
  #tapstart.show { display: flex; }
  #status-note {
    position: fixed; inset: 0; background: #000; z-index: 8;
    display: none; align-items: center; justify-content: center;
    font-size: 2vh; color: #71717a; letter-spacing: -0.01em;
    pointer-events: none;
  }
  #status-note.show { display: flex; }
  video#vkeep { position: fixed; width: 2px; height: 2px; opacity: 0.01; bottom: 0; left: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="slide-a" class="slide"></div>
<div id="slide-b" class="slide"></div>
<button id="fsbtn" type="button">&#x26F6; fullscreen</button>
<div id="tapstart">tap anywhere to start</div>
<div id="status-note">couldn't load photos, retrying</div>

<script>
(function () {
  "use strict";

  /* ================= CONFIG ================= */
  var SLIDE_MS = 15000;   // time per photo
  var PAIR_HOLD = 1.5;    // multiplier for paired slides
  var SHUFFLE = true;     // randomize order on load

  /* ================= slideshow ================= */
  var slides = [
    document.getElementById('slide-a'),
    document.getElementById('slide-b')
  ];
  var photos = [], slideQueue = [], slideIdx = 0, front = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function photoSrc(p) { return typeof p === 'string' ? p : (p && p.src ? p.src : ''); }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      if (!src) { reject(new Error('Empty src')); return; }
      var img = new Image();
      img.src = src;
      if (typeof img.decode === 'function') {
        img.decode().then(function () {
          resolve(img);
        }).catch(function () {
          img.onload = function () { resolve(img); };
          img.onerror = function () { reject(new Error('Image failed to load: ' + src)); };
          if (img.complete) {
            if (img.naturalWidth > 0) resolve(img);
            else reject(new Error('Image failed to load: ' + src));
          }
        });
      } else {
        img.onload = function () { resolve(img); };
        img.onerror = function () { reject(new Error('Image failed to load: ' + src)); };
        if (img.complete) {
          if (img.naturalWidth > 0) resolve(img);
          else reject(new Error('Image failed to load: ' + src));
        }
      }
    });
  }

  function preloadSlide(slide) {
    if (!slide || !slide.photos) return;
    for (var i = 0; i < slide.photos.length; i++) {
      loadImage(photoSrc(slide.photos[i])).catch(function () {});
    }
  }

  function getViewportSize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h, va: w / h };
  }

  function cropLoss(ia, ca) {
    var minA = Math.min(ia, ca);
    var maxA = Math.max(ia, ca);
    return 1 - (minA / maxA);
  }

  function isPairable(img, va) {
    if (!img || !img.w || !img.h) return false;
    var ia = img.w / img.h;
    var caFull = va;
    var caHalf = (va < 1) ? (2 * va) : (va / 2);
    var lossFull = cropLoss(ia, caFull);
    var lossHalf = cropLoss(ia, caHalf);
    return (lossFull - lossHalf) >= 0.15;
  }

  function buildSlideQueue(list, va) {
    var queue = [];
    var isPair = [];
    for (var i = 0; i < list.length; i++) {
      isPair.push(isPairable(list[i], va));
    }
    var used = new Array(list.length).fill(false);
    for (var i = 0; i < list.length; i++) {
      if (used[i]) continue;
      var p1 = list[i];
      if (!isPair[i]) {
        queue.push({ type: 'single', photos: [p1] });
        used[i] = true;
      } else {
        var nextIdx = -1;
        for (var j = i + 1; j < list.length; j++) {
          if (!used[j] && isPair[j]) {
            nextIdx = j;
            break;
          }
        }
        if (nextIdx !== -1) {
          queue.push({ type: 'pair', photos: [p1, list[nextIdx]] });
          used[i] = true;
          used[nextIdx] = true;
        } else {
          queue.push({ type: 'leftover', photos: [p1] });
          used[i] = true;
        }
      }
    }
    return queue;
  }

  function renderSlide(slideEl, slide, va) {
    slideEl.innerHTML = '';
    if (!slide || !slide.photos.length) return;
    if (slide.type === 'single') {
      var cell = document.createElement('div');
      cell.className = 'cell cover';
      cell.style.backgroundImage = 'url("' + photoSrc(slide.photos[0]) + '")';
      slideEl.appendChild(cell);
    } else if (slide.type === 'pair') {
      var container = document.createElement('div');
      container.className = 'pair-container ' + (va < 1 ? 'portrait-split' : 'landscape-split');
      for (var i = 0; i < slide.photos.length; i++) {
        var cell = document.createElement('div');
        cell.className = 'cell cover';
        cell.style.backgroundImage = 'url("' + photoSrc(slide.photos[i]) + '")';
        container.appendChild(cell);
      }
      slideEl.appendChild(container);
    } else if (slide.type === 'leftover') {
      var container = document.createElement('div');
      container.className = 'leftover-container';
      var bg = document.createElement('div');
      bg.className = 'backdrop';
      bg.style.backgroundImage = 'url("' + photoSrc(slide.photos[0]) + '")';
      var fg = document.createElement('div');
      fg.className = 'foreground';
      fg.style.backgroundImage = 'url("' + photoSrc(slide.photos[0]) + '")';
      container.appendChild(bg);
      container.appendChild(fg);
      slideEl.appendChild(container);
    }
  }

  var showSeq = 0;
  function show(targetIdx) {
    if (!slideQueue.length) return;
    var curIdx = ((targetIdx % slideQueue.length) + slideQueue.length) % slideQueue.length;
    var targetSlide = slideQueue[curIdx];
    var seq = ++showSeq;

    var loadPromises = targetSlide.photos.map(function (p) {
      return loadImage(photoSrc(p)).then(function () {
        return { photo: p, ok: true };
      }).catch(function (err) {
        return { photo: p, ok: false, err: err };
      });
    });

    Promise.all(loadPromises).then(function (results) {
      if (seq !== showSeq) return;

      var failed = results.filter(function (r) { return !r.ok; });
      if (failed.length > 0) {
        var badPhotos = failed.map(function (r) { return r.photo; });
        photos = photos.filter(function (p) {
          return !badPhotos.some(function (b) { return (b.f && b.f === p.f) || b.src === p.src; });
        });
        var vp = getViewportSize();
        slideQueue = buildSlideQueue(photos, vp.va);
        if (!slideQueue.length) return;
        show(curIdx);
        return;
      }

      slideIdx = curIdx;
      var back = 1 - front;
      var vp = getViewportSize();
      renderSlide(slides[back], targetSlide, vp.va);
      void slides[back].offsetWidth;
      slides[back].classList.add('visible');
      slides[front].classList.remove('visible');
      front = back;

      // Preload next slide images in the background
      var nextSlide = slideQueue[(slideIdx + 1) % slideQueue.length];
      preloadSlide(nextSlide);

      // Restart auto-advance timer for this slide
      scheduleNext();
    });
  }

  var slideTimer = null;
  function getSlideDuration(slide) {
    if (slide && slide.type === 'pair') {
      return Math.round(SLIDE_MS * PAIR_HOLD);
    }
    return SLIDE_MS;
  }

  function scheduleNext() {
    if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
    if (!slideQueue.length) return;
    var duration = getSlideDuration(slideQueue[slideIdx]);
    slideTimer = setTimeout(function () {
      next();
    }, duration);
  }

  function wrapQueue() {
    var lastSlide = slideQueue[slideIdx];
    var lastPhotos = lastSlide ? lastSlide.photos : [];
    if (SHUFFLE) {
      shuffle(photos);
    }
    var vp = getViewportSize();
    slideQueue = buildSlideQueue(photos, vp.va);
    if (slideQueue.length > 1 && lastPhotos.length > 0) {
      var firstShares = slideQueue[0].photos.some(function (p1) {
        return lastPhotos.some(function (p2) {
          return (p1.f && p1.f === p2.f) || p1.src === p2.src;
        });
      });
      if (firstShares) {
        for (var k = 1; k < slideQueue.length; k++) {
          var shares = slideQueue[k].photos.some(function (p1) {
            return lastPhotos.some(function (p2) {
              return (p1.f && p1.f === p2.f) || p1.src === p2.src;
            });
          });
          if (!shares) {
            var temp = slideQueue[0];
            slideQueue[0] = slideQueue[k];
            slideQueue[k] = temp;
            break;
          }
        }
      }
    }
  }

  function next() {
    if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
    if (!slideQueue.length) return;
    if (slideIdx + 1 >= slideQueue.length) {
      wrapQueue();
      show(0);
    } else {
      show(slideIdx + 1);
    }
  }

  function scheduleNightlyReload() {
    var now = new Date();
    var next4am = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 4, 0, 0, 0);
    if (now.getTime() >= next4am.getTime()) {
      next4am.setDate(next4am.getDate() + 1);
    }
    var msUntil4am = next4am.getTime() - now.getTime();
    setTimeout(function () {
      location.reload();
    }, msUntil4am);
  }

  function start() {
    if (!photos.length) return;
    if (SHUFFLE) shuffle(photos);
    var vp = getViewportSize();
    slideQueue = buildSlideQueue(photos, vp.va);
    slideIdx = 0;
    show(0);
    scheduleNightlyReload();
  }

  var resizeTimer = null;
  function handleResize() {
    if (!photos.length || !slideQueue.length) return;
    var currentPhoto = null;
    if (slideQueue[slideIdx] && slideQueue[slideIdx].photos.length) {
      currentPhoto = slideQueue[slideIdx].photos[0];
    }
    var vp = getViewportSize();
    slideQueue = buildSlideQueue(photos, vp.va);
    var newIdx = 0;
    if (currentPhoto) {
      for (var i = 0; i < slideQueue.length; i++) {
        for (var j = 0; j < slideQueue[i].photos.length; j++) {
          if (slideQueue[i].photos[j].f === currentPhoto.f || slideQueue[i].photos[j].src === currentPhoto.src) {
            newIdx = i;
            break;
          }
        }
        if (newIdx === i) break;
      }
    }
    slideIdx = newIdx;
    renderSlide(slides[front], slideQueue[slideIdx], vp.va);
  }
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(handleResize, 300);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  var armed = false;

  /* ---------- photo list & manifest loading with backoff ---------- */
  var statusNoteEl = document.getElementById('status-note');
  function showStatusNote() {
    if (statusNoteEl) statusNoteEl.classList.add('show');
  }
  function hideStatusNote() {
    if (statusNoteEl) statusNoteEl.classList.remove('show');
  }

  var backoffs = [5000, 15000, 60000, 300000];
  var retryAttempt = 0;

  function loadManifest() {
    fetch('photos/photos.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (list) {
        hideStatusNote();
        retryAttempt = 0;
        initPhotos(list);
      })
      .catch(function () {
        showStatusNote();
        var delay = backoffs[Math.min(retryAttempt, backoffs.length - 1)];
        retryAttempt++;
        setTimeout(loadManifest, delay);
      });
  }

  function initPhotos(list) {
    photos = list.map(function (item) {
      if (typeof item === 'string') {
        return { f: item, src: item, w: 0, h: 0 };
      }
      return { f: item.f, w: item.w, h: item.h, src: 'photos/' + item.f };
    });
    start();
  }

  loadManifest();

  /* ---------- 1) Screen Wake Lock API ---------- */
  var wakeLock = null;
  async function requestLock() {
    if (!('wakeLock' in navigator)) return false;
    if (wakeLock && !wakeLock.released) return true;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function () {
        wakeLock = null;
      });
      return true;
    } catch (e) {
      wakeLock = null;
      return false;
    }
  }
  setInterval(requestLock, 60000);

  /* ---------- 2) muted audio keepalive (keeps Silk from timing out) ---------- */
  var audio = document.getElementById('akeep');
  function keepAudio() {
    try {
      var p = audio.play();
      if (p && p.catch) p.catch(function () { showTapStart(); });
    } catch (e) { showTapStart(); }
  }

  /* ---------- 3) fallback silent video frame ---------- */
  try {
    var v = document.getElementById('vkeep');
    var c = document.createElement('canvas'); c.width = 2; c.height = 2;
    v.srcObject = c.captureStream(1);
    v.play().catch(function(){});
  } catch (e) {}

  /* ---------- 4) fullscreen ---------- */
  var fsBtn = document.getElementById('fsbtn');
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function goFullscreen() {
    if (isFullscreen()) return;
    var el = document.documentElement;
    try {
      var p = null;
      if (el.requestFullscreen) {
        try { p = el.requestFullscreen({ navigationUI: 'hide' }); }
        catch (e) { p = el.requestFullscreen(); }
      } else if (el.webkitRequestFullscreen) {
        p = el.webkitRequestFullscreen();
      }
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }
  function renderFsBtn() { fsBtn.classList.toggle('hide', isFullscreen()); }
  document.addEventListener('fullscreenchange', renderFsBtn);
  document.addEventListener('webkitfullscreenchange', renderFsBtn);
  fsBtn.addEventListener('click', function (e) { e.stopPropagation(); goFullscreen(); });
  fsBtn.addEventListener('pointerup', function (e) { e.stopPropagation(); });
  renderFsBtn();

  /* ---------- visibility: re-arm everything ---------- */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { requestLock(); keepAudio(); goFullscreen(); }
  });

  /* ---------- gesture handling (arms on first, advances on later) ---------- */
  var tapEl = document.getElementById('tapstart');
  function showTapStart() { tapEl.classList.add('show'); }
  function hideTapStart() { tapEl.classList.remove('show'); }
  function arm() {
    hideTapStart(); requestLock(); keepAudio(); goFullscreen();
    armed = true;
  }
  document.addEventListener('pointerup', function (e) {
    if (e.target && (e.target.id === 'fsbtn' || (e.target.closest && e.target.closest('#fsbtn')))) {
      return;
    }
    if (!armed) {
      arm();
      return;
    }
    next();
  });

  /* ---------- go ---------- */
  requestLock();
  keepAudio();
  goFullscreen();
  setTimeout(keepAudio, 1500);
  setTimeout(function(){ if (audio.paused) showTapStart(); }, 4000);
})();
</script>
</body>
</html>
