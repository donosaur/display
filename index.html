<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: none;
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .slide {
    position: fixed; inset: 0;
    background-color: #000; background-position: center; background-repeat: no-repeat;
    background-size: cover;
    opacity: 0; transition: opacity 1.8s ease-in-out;
  }
  .slide.visible { opacity: 1; }
  #fsbtn {
    position: fixed; bottom: 1.5vh; left: 2vw; z-index: 5;
    font-size: 1.6vh; color: rgba(255,255,255,0.5); background: rgba(20,20,22,0.7);
    border: 1px solid #2a2a30; border-radius: 1vh;
    padding: 0.8vh 1.8vh; cursor: pointer;
    display: flex; align-items: center; gap: 0.8vh; font-family: inherit;
  }
  #fsbtn.hide { display: none; }
  #tapstart {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 10;
    display: none; align-items: center; justify-content: center;
    font-size: 3vh; color: #d4d4d8; cursor: pointer;
  }
  #tapstart.show { display: flex; }
  video#vkeep { position: fixed; width: 2px; height: 2px; opacity: 0.01; bottom: 0; left: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="slide-a" class="slide"></div>
<div id="slide-b" class="slide"></div>
<button id="fsbtn" type="button">&#x26F6; fullscreen</button>
<div id="tapstart">tap anywhere to start</div>

<audio id="akeep" loop muted playsinline preload="auto"
  src="data:audio/wav;base64,UklGRmQfAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAfAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC <video id="vkeep" loop muted playsinline></video>

<script>
(function () {
  "use strict";

  /* ================= CONFIG ================= */
  var SLIDE_MS = 15000;   // time per photo
  var SHUFFLE = true;     // randomize order on load
  var SHOW_CLOCK = false;  // clock overlay disabled
  var INLINE_PHOTOS = ["photos/photo-01.jpg", "photos/photo-02.jpg", "photos/photo-03.jpg", "photos/photo-04.jpg", "photos/photo-05.jpg", "photos/photo-06.jpg", "photos/photo-07.jpg", "photos/photo-08.jpg", "photos/photo-09.jpg", "photos/photo-11.jpg", "photos/photo-12.jpg", "photos/photo-13.jpg", "photos/photo-14.jpg", "photos/photo-15.jpg", "photos/photo-16.jpg", "photos/photo-17.jpg", "photos/photo-18.jpg", "photos/photo-19.jpg", "photos/photo-20.jpg", "photos/photo-21.jpg", "photos/photo-22.jpg", "photos/photo-23.jpg", "photos/photo-24.jpg", "photos/photo-25.jpg", "photos/photo-26.jpg", "photos/photo-27.jpg", "photos/photo-28.jpg", "photos/photo-29.jpg", "photos/photo-30.jpg"]; // fallback if photos.json missing

  /* ================= slideshow ================= */
  var slides = [
    document.getElementById('slide-a'),
    document.getElementById('slide-b')
  ];
  var photos = [], idx = 0, front = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function preload(src) { var im = new Image(); im.src = src; }
  function show(i) {
    var back = 1 - front;
    slides[back].style.backgroundImage = 'url("' + photos[i] + '")';
    // force reflow so the fade retriggers even for repeat URLs
    void slides[back].offsetWidth;
    slides[back].classList.add('visible');
    slides[front].classList.remove('visible');
    front = back;
    preload(photos[(i + 1) % photos.length]);
    preload(photos[(i + 2) % photos.length]);
  }
  function next() { idx = (idx + 1) % photos.length; show(idx); }
  function start() {
    if (!photos.length) return;
    if (SHUFFLE) shuffle(photos);
    // show first immediately on the front layer
    slides[front].style.backgroundImage = 'url("' + photos[0] + '")';
    slides[front].classList.add('visible');
    preload(photos[1 % photos.length]);
    setInterval(next, SLIDE_MS);
  }
  // tap advances to next photo (after the initial arming tap)
  var armed = false;
  document.addEventListener('click', function () {
    if (!armed) return; // first tap is for arming keep-awake/fullscreen
    next();
  });

  // photo list: try photos.json first, fall back to inline list
  function initPhotos(list) {
    photos = list.slice();
    start();
  }
  try {
    fetch('photos/photos.json').then(function (r) {
      if (!r.ok) throw 0;
      return r.json();
    }).then(function (list) {
      initPhotos(list.map(function (f) { return 'photos/' + f; }));
    }).catch(function () { initPhotos(INLINE_PHOTOS); });
  } catch (e) { initPhotos(INLINE_PHOTOS); }

  /* ---------- clock overlay ---------- */
  var clockEl = document.getElementById('clock-overlay');
  if (clockEl) { clockEl.style.display = 'none'; }

  /* ---------- stay-awake status ---------- */
  var badge = document.getElementById('stay-awake');
  var badgeText = document.getElementById('stay-awake-text');
  var lockCount = 0;
  function renderBadge() {
    if (!badge) return;
    var on = lockCount > 0;
    badge.classList.toggle('on', on);
    if (badgeText) badgeText.textContent = on ? 'stay-awake' : '';
  }

  /* ---------- 1) Screen Wake Lock API ---------- */
  var wakeLock = null;
  function releaseLock() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  async function requestLock() {
    if (!('wakeLock' in navigator)) return false;
    try {
      releaseLock();
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function () { lockCount = Math.max(0, lockCount - 1); renderBadge(); });
      lockCount++; renderBadge();
      return true;
    } catch (e) { return false; }
  }
  setInterval(requestLock, 60000);

  /* ---------- 2) muted audio keepalive (keeps Silk from timing out) ---------- */
  var audio = document.getElementById('akeep');
  function keepAudio() {
    try {
      var p = audio.play();
      if (p && p.catch) p.catch(function () { showTapStart(); });
    } catch (e) { showTapStart(); }
  }

  /* ---------- 3) fallback silent video frame ---------- */
  try {
    var v = document.getElementById('vkeep');
    var c = document.createElement('canvas'); c.width = 2; c.height = 2;
    v.srcObject = c.captureStream(1);
    v.play().catch(function(){});
  } catch (e) {}

  /* ---------- 4) fullscreen ---------- */
  var fsBtn = document.getElementById('fsbtn');
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function goFullscreen() {
    if (isFullscreen()) return;
    var el = document.documentElement;
    try {
      var p = null;
      if (el.requestFullscreen) {
        try { p = el.requestFullscreen({ navigationUI: 'hide' }); }
        catch (e) { p = el.requestFullscreen(); }
      } else if (el.webkitRequestFullscreen) {
        p = el.webkitRequestFullscreen();
      }
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }
  function renderFsBtn() { fsBtn.classList.toggle('hide', isFullscreen()); }
  document.addEventListener('fullscreenchange', renderFsBtn);
  document.addEventListener('webkitfullscreenchange', renderFsBtn);
  fsBtn.addEventListener('click', function (e) { e.stopPropagation(); goFullscreen(); });
  renderFsBtn();

  /* ---------- visibility: re-arm everything ---------- */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { requestLock(); keepAudio(); goFullscreen(); }
  });

  /* ---------- tap-to-start ---------- */
  var tapEl = document.getElementById('tapstart');
  function showTapStart() { tapEl.classList.add('show'); }
  function hideTapStart() { tapEl.classList.remove('show'); }
  function arm() {
    hideTapStart(); requestLock(); keepAudio(); goFullscreen();
    armed = true;
  }
  tapEl.addEventListener('click', function (e) { e.stopPropagation(); arm(); });
  function firstGesture() {
    document.removeEventListener('click', firstGesture);
    document.removeEventListener('touchstart', firstGesture);
    arm();
  }
  document.addEventListener('click', firstGesture);
  document.addEventListener('touchstart', firstGesture);

  /* ---------- go ---------- */
  requestLock();
  keepAudio();
  goFullscreen();
  setTimeout(keepAudio, 1500);
  setTimeout(function(){ if (audio.paused) showTapStart(); }, 4000);
})();
</script>
